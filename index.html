<script>
const EX=[
{id:'bench',name:'Press de banca',cat:'GYM',group:'Pecho',level:'Todos',series:4,reps:'8–12',rest:'90 s',function:'Desarrolla la fuerza de empuje horizontal y prioriza el pectoral mayor con ayuda del tríceps y del deltoide anterior.',main:'Pectoral mayor',secondary:'Tríceps braquial · Deltoide anterior',stabilizers:'Serrato anterior · Manguito rotador · Core',tech:['Apoya cabeza, espalda alta y glúteos en el banco.','Retrae y desciende las escápulas antes de sacar la barra.','Agarra algo más ancho que los hombros y mantén las muñecas neutras.','Baja la barra con control hacia la zona media-baja del pecho.','Empuja manteniendo los pies firmes y sin perder la posición escapular.'],errors:['Abrir demasiado los codos','Rebotar la barra en el pecho','Despegar glúteos del banco','Doblar en exceso las muñecas'],equipment:'Banco plano · Barra · Discos · Rack o soportes',variants:'Press inclinado · Press declinado · Mancuernas · Agarre cerrado · Máquina · Bandas'},
{id:'incline',name:'Press inclinado con mancuernas',cat:'GYM',group:'Pecho',level:'Todos',series:4,reps:'8–12',rest:'90 s',function:'Enfatiza la porción clavicular del pectoral y permite un recorrido independiente de cada brazo.',main:'Pectoral superior',secondary:'Deltoide anterior · Tríceps',stabilizers:'Manguito rotador · Serrato · Core',tech:['Ajusta el banco entre 20 y 35 grados.','Apoya bien los pies y fija las escápulas.','Parte con las mancuernas cerca del pecho.','Empuja arriba sin chocar las mancuernas.','Desciende con control manteniendo antebrazos estables.'],errors:['Banco demasiado vertical','Codos excesivamente abiertos','Arqueo lumbar exagerado','Perder control al bajar'],equipment:'Banco regulable · Mancuernas',variants:'Barra inclinada · Máquina convergente · Press neutro · Unilateral · Smith · Bandas'},
{id:'fly',name:'Aperturas con mancuernas',cat:'GYM',group:'Pecho',level:'Intermedio',series:3,reps:'10–15',rest:'75 s',function:'Trabaja la aducción horizontal del hombro con gran énfasis en el pectoral y menor participación del tríceps.',main:'Pectoral mayor',secondary:'Deltoide anterior',stabilizers:'Manguito rotador · Serrato',tech:['Túmbate con escápulas estables.','Mantén una flexión suave de codos.','Abre los brazos en arco controlado.','Detén antes de perder tensión o comodidad del hombro.','Cierra llevando los brazos hacia la línea media.'],errors:['Bajar demasiado','Convertirlo en press','Bloquear los codos','Usar demasiado peso'],equipment:'Banco · Mancuernas',variants:'Poleas · Máquina pec deck · Inclinado · Unilateral · Bandas · Suelo'},
{id:'pushup',name:'Flexiones',cat:'CALISTENIA',group:'Pecho',level:'Todos',series:3,reps:'8–15',rest:'60 s',function:'Patrón de empuje horizontal con peso corporal que integra pecho, tríceps, hombro y estabilidad del tronco.',main:'Pectoral mayor',secondary:'Tríceps · Deltoide anterior',stabilizers:'Core · Serrato · Glúteos',tech:['Manos ligeramente más anchas que hombros.','Cuerpo alineado de cabeza a talones.','Desciende manteniendo codos aproximadamente a 30–45°.','Acerca el pecho al suelo sin colapsar la zona lumbar.','Empuja separando el suelo y manteniendo el abdomen firme.'],errors:['Cadera caída','Codos a 90°','Recorrido muy corto','Cabeza adelantada'],equipment:'Peso corporal · Esterilla opcional',variants:'Rodillas · Inclinadas · Diamante · Declive · Archer · Explosivas'},
{id:'lat',name:'Jalón al pecho',cat:'GYM',group:'Espalda',level:'Todos',series:4,reps:'8–12',rest:'90 s',function:'Entrena la aducción y extensión del hombro, desarrollando especialmente el dorsal ancho.',main:'Dorsal ancho',secondary:'Bíceps · Redondo mayor',stabilizers:'Trapecio medio/inferior · Core',tech:['Ajusta el apoyo de muslos.','Agarra la barra con anchura cómoda.','Eleva el pecho sin arquear en exceso.','Lleva los codos hacia abajo acercando la barra al pecho alto.','Controla el regreso hasta estirar los dorsales.'],errors:['Llevar barra tras la nuca','Balancear el torso','Tirar solo con brazos','Soltar rápido arriba'],equipment:'Polea alta · Barra de jalón · Asiento',variants:'Agarre neutro · Supino · Unilateral · Máquina · Banda · Dominada asistida'},
{id:'row',name:'Remo sentado',cat:'GYM',group:'Espalda',level:'Todos',series:4,reps:'8–12',rest:'90 s',function:'Fortalece la retracción escapular y la musculatura media de la espalda mediante un tirón horizontal.',main:'Dorsal · Romboides',secondary:'Trapecio medio · Bíceps',stabilizers:'Erectores espinales · Core',tech:['Siéntate alto con columna neutra.','Empieza con hombros relajados y brazos extendidos.','Lleva el agarre hacia el abdomen.','Junta las escápulas sin elevar los hombros.','Vuelve de forma controlada sin redondear la espalda.'],errors:['Balancearse','Encoger hombros','Redondear zona lumbar','Tirar con impulso'],equipment:'Polea baja · Asiento · Agarre de remo',variants:'Agarre ancho · Neutro · Unilateral · Máquina · Banda · Remo pecho apoyado'},
{id:'dbrow',name:'Remo con mancuerna',cat:'GYM',group:'Espalda',level:'Todos',series:3,reps:'10–12',rest:'75 s',function:'Tirón unilateral que fortalece dorsal y espalda media y permite trabajar simetrías.',main:'Dorsal ancho',secondary:'Romboides · Bíceps',stabilizers:'Core · Erectores',tech:['Apoya una mano y una rodilla en banco.','Mantén espalda neutra.','Deja colgar la mancuerna sin girar el tronco.','Lleva el codo hacia la cadera.','Desciende controlando el estiramiento.'],errors:['Rotar el tronco','Encoger hombro','Tirar hacia el pecho','Usar impulso'],equipment:'Mancuerna · Banco',variants:'Sin banco · Pecho apoyado · Kroc row · Polea · Banda · Landmine'},

{id:'ohp',name:'Press militar',cat:'GYM',group:'Hombro',level:'Intermedio',series:4,reps:'6–10',rest:'90 s',function:'Desarrolla fuerza de empuje vertical y estabilidad del complejo escapulohumeral.',main:'Deltoides',secondary:'Tríceps · Trapecio superior',stabilizers:'Core · Serrato · Manguito rotador',tech:['Pies firmes y abdomen activo.','Barra a la altura clavicular.','Antebrazos verticales.','Empuja por encima de la cabeza dejando pasar la barra cerca de la cara.','Finaliza con brazos alineados y controla la bajada.'],errors:['Hiperextender zona lumbar','Barra muy adelantada','Muñecas vencidas','Encoger hombros pronto'],equipment:'Barra o mancuernas · Rack',variants:'Mancuernas · Sentado · Arnold · Landmine · Máquina · Unilateral'},
{id:'lateral',name:'Elevaciones laterales',cat:'GYM',group:'Hombro',level:'Todos',series:3,reps:'12–15',rest:'60 s',function:'Aísla principalmente el deltoide medio para mejorar anchura y control del hombro.',main:'Deltoide medio',secondary:'Supraespinoso',stabilizers:'Trapecio · Core',tech:['Mancuernas junto al cuerpo.','Flexiona ligeramente los codos.','Eleva en el plano escapular.','Llega aproximadamente a la altura de hombros.','Baja lentamente manteniendo tensión.'],errors:['Impulso con tronco','Subir demasiado','Encoger hombros','Peso excesivo'],equipment:'Mancuernas',variants:'Polea · Máquina · Unilateral · Inclinado · Sentado · Bandas'},
{id:'curl',name:'Curl de bíceps',cat:'GYM',group:'Brazos',level:'Todos',series:3,reps:'10–15',rest:'60 s',function:'Flexiona el codo y desarrolla principalmente bíceps braquial y braquial.',main:'Bíceps braquial',secondary:'Braquial · Braquiorradial',stabilizers:'Antebrazo · Core',tech:['Codos cerca del cuerpo.','Mantén muñecas neutras.','Flexiona sin adelantar hombros.','Contrae arriba sin perder alineación.','Desciende hasta casi extender por completo.'],errors:['Balancear espalda','Mover codos','Recortar recorrido','Doblar muñecas'],equipment:'Mancuernas o barra',variants:'Martillo · Predicador · Inclinado · Polea · Barra Z · Unilateral'},
{id:'triceps',name:'Extensión de tríceps',cat:'GYM',group:'Brazos',level:'Todos',series:3,reps:'10–15',rest:'60 s',function:'Extiende el codo y enfatiza las tres cabezas del tríceps.',main:'Tríceps braquial',secondary:'Ancóneo',stabilizers:'Deltoides · Core',tech:['Fija los codos junto al cuerpo.','Empieza con antebrazos flexionados.','Extiende hacia abajo sin mover hombros.','Finaliza sin hiperextender codo.','Regresa controladamente.'],errors:['Abrir codos','Balancear torso','Usar hombros','Subir demasiado la carga'],equipment:'Polea alta · Cuerda o barra',variants:'Cuerda · Barra recta · Unilateral · Francés · Fondos asistidos · Banda'},
{id:'squat',name:'Sentadilla con mancuernas',cat:'GYM',group:'Pierna',level:'Todos',series:4,reps:'10–12',rest:'90 s',function:'Patrón dominante de rodilla y cadera para desarrollar cuádriceps, glúteos y estabilidad global.',main:'Cuádriceps · Glúteo mayor',secondary:'Aductores · Isquiotibiales',stabilizers:'Core · Erectores · Gemelos',tech:['Pies a una anchura cómoda.','Mancuernas estables y abdomen activo.','Desciende llevando cadera y rodillas de forma coordinada.','Mantén rodillas siguiendo la línea de los pies.','Sube empujando el suelo y extendiendo cadera y rodillas.'],errors:['Rodillas colapsan hacia dentro','Talones se levantan','Espalda se redondea','Recorrido forzado'],equipment:'Mancuernas',variants:'Goblet · Barra trasera · Frontal · Hack · Smith · Peso corporal'},
{id:'lunge',name:'Zancadas',cat:'GYM',group:'Pierna',level:'Todos',series:3,reps:'10/cada',rest:'75 s',function:'Ejercicio unilateral que mejora fuerza, equilibrio y control de cadera y rodilla.',main:'Cuádriceps · Glúteo mayor',secondary:'Isquiotibiales · Aductores',stabilizers:'Glúteo medio · Core · Gemelos',tech:['Da un paso suficientemente largo.','Mantén tronco estable.','Desciende ambas rodillas con control.','Rodilla delantera sigue la dirección del pie.','Empuja con el pie delantero para volver.'],errors:['Paso demasiado corto','Rodilla cae hacia dentro','Perder equilibrio','Golpear la rodilla trasera'],equipment:'Peso corporal o mancuernas',variants:'Atrás · Caminando · Búlgara · Lateral · Curtsy · Step-up'},
{id:'rdl',name:'Peso muerto rumano',cat:'GYM',group:'Pierna',level:'Intermedio',series:4,reps:'8–12',rest:'100 s',function:'Patrón de bisagra de cadera que enfatiza isquiotibiales y glúteos.',main:'Isquiotibiales · Glúteo mayor',secondary:'Aductores',stabilizers:'Erectores · Dorsal · Core',tech:['Sujeta la carga cerca de los muslos.','Flexiona ligeramente rodillas.','Lleva la cadera atrás manteniendo columna neutra.','Desciende hasta sentir tensión en isquiotibiales.','Extiende cadera sin hiperextender la espalda.'],errors:['Convertirlo en sentadilla','Alejar la carga del cuerpo','Redondear espalda','Bajar más allá del control'],equipment:'Barra o mancuernas',variants:'Mancuernas · Unilateral · Barra · Smith · Landmine · Banda'},

const GYMPLANS=['Full Body Esencial','Full Body Fuerza','Full Body Hipertrofia','Full Body Máquinas','Full Body + Core','Torso / Pierna','Push / Pull / Legs','Upper / Lower','Equilibrio + Core','Progresión Base'];
const CAL={beginner:['Sentadilla peso corporal','Flexiones de rodillas','Zancadas alternas','Mountain climbers lentos','Plancha','Plancha final'],intermediate:['Sentadillas','Flexiones','Zancadas','Mountain climbers','Plancha con toques'],advanced:['Pike push-ups','Flexiones explosivas','Pistol parcial','Burpees','Hollow hold']};
let state={screen:'home',selected:null,anTab:'anatomy',search:'',workout:null};
const $=id=>document.getElementById(id);
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');state.screen=id;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.go===id));render(id);scrollTo(0,0)}
function head(title,back='home'){return `<div class="modulehead"><button class="back" onclick="go('${back}')">‹</button><div><div class="eyebrow">DM FITNESS</div><h1>${title}</h1></div></div>`}
function renderHome(){ $('home').innerHTML=`<div class="topbar"><div class="brand">DM <span>FITNESS</span></div><button class="iconbtn" onclick="go('more')">☰</button></div><div class="hero"><div class="eyebrow">ENTRENAMIENTO DE HOY</div><h1>HOY CUENTA.<br>VAMOS A POR ELLO.</h1><p class="muted">Dos mundos de entrenamiento, una sola aplicación: GYM y Calistenia, sin mezclarlos.</p><div class="progress"><i style="width:46%"></i></div><div class="grid3" style="margin-top:15px"><div class="card metric"><b>7</b><span>racha</span></div><div class="card metric"><b>18</b><span>sesiones</span></div><div class="card metric"><b>Inter.</b><span>nivel</span></div></div><button class="btn full" style="margin-top:14px" onclick="startWorkout('gym')">COMENZAR ENTRENAMIENTO</button></div><div class="sectiontitle"><h2>Accesos rápidos</h2></div><div class="grid2"><div class="card quick" onclick="go('gym')"><div class="emoji">🏋️</div><div><b>GYM</b><div class="muted">Planes, máquinas y pesos</div></div></div><div class="card quick" onclick="go('calis')"><div class="emoji">🤸</div><div><b>CALISTENIA</b><div class="muted">Peso corporal y progresiones</div></div></div><div class="card quick" onclick="go('exercises')"><div class="emoji">📚</div><div><b>EJERCICIOS</b><div class="muted">Biblioteca completa</div></div></div><div class="card quick" onclick="go('progress')"><div class="emoji">📈</div><div><b>PROGRESO</b><div class="muted">Sesiones y evolución</div></div></div></div>`}
function renderGym(){ $('gym').innerHTML=`${head('GYM','home')}<div class="hero"><div class="eyebrow">MÓDULO INDEPENDIENTE</div><h1 style="font-size:1.65rem">Entrenamiento con cargas</h1><p class="muted">Rutinas, máquinas, pesos libres, series, repeticiones y descansos.</p><button class="btn" onclick="startWorkout('gym')">INICIAR SESIÓN GYM</button></div><div class="sectiontitle"><h2>Planes</h2></div>${GYMPLANS.map((p,i)=>`<div class="card plan" style="margin-bottom:10px"><span class="tag">${i<5?'DIARIO':i<9?'SEMANAL':'MENSUAL'}</span><span class="tag">${i%3===0?'PRINCIPIANTE':i%3===1?'INTERMEDIO':'AVANZADO'}</span><h3>${p}</h3><p class="muted">Selección equilibrada de ejercicios de fuerza con progresión, descansos y seguimiento.</p><button class="btn secondary" onclick="alert('Plan ${p} seleccionado')">VER PLAN</button></div>`).join('')}<div class="sectiontitle"><h2>Ejercicios GYM</h2><button onclick="state.search='';go('exercises')">Ver todos</button></div>${EX.filter(e=>e.cat==='GYM').slice(0,6).map(exCard).join('')}`}
function exCard(e){return `<div class="card exercise" style="margin-bottom:10px" onclick="openEx('${e.id}')"><div class="art"><div class="person"><i class="head"></i><i class="torso"></i><i class="limb a1"></i><i class="limb a2"></i><i class="limb l1"></i><i class="limb l2"></i></div><span class="target">${e.group}</span></div><div><h3>${e.name}</h3><p>${e.main}<br>${e.series} series · ${e.reps}</p></div><div class="chev">›</div></div>`}
function renderExercises(){let q=state.search.toLowerCase();let list=EX.filter(e=>!q||(`${e.name} ${e.group} ${e.cat}`).toLowerCase().includes(q));$('exercises').innerHTML=`${head('Ejercicios','home')}<input class="search" placeholder="Buscar ejercicio, músculo o categoría" value="${state.search}" oninput="state.search=this.value;renderExercises()"><div class="chips" style="margin:12px 0"><button class="pill" onclick="state.search='GYM';renderExercises()">GYM</button><button class="pill" onclick="state.search='CALISTENIA';renderExercises()">CALISTENIA</button><button class="pill" onclick="state.search='Pecho';renderExercises()">Pecho</button><button class="pill" onclick="state.search='Pierna';renderExercises()">Pierna</button><button class="pill" onclick="state.search='Espalda';renderExercises()">Espalda</button></div>${list.map(exCard).join('')}`}
function openEx(id){state.selected=id;go('detail')}
function lottie(e){return `<div class="lottiebox"><div class="figure"><i class="fh"></i><i class="ft"></i><i class="fa"></i><i class="fb"></i><i class="fl"></i><i class="fr"></i></div><div style="position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between"><span class="tag">MOVIMIENTO GUIADO</span><button class="pill" onclick="replayAnim(this)">↻ REPETIR</button></div></div>`}
function replayAnim(btn){let f=btn.closest('.lottiebox').querySelector('.figure');f.style.animation='none';void f.offsetWidth;f.style.animation='bob 2.8s ease-in-out 1'}
function renderDetail(){let e=EX.find(x=>x.id===state.selected)||EX[0];$('detail').innerHTML=`${head('Ejercicio','exercises')}<div class="eyebrow">${e.cat} · ${e.group}</div><h1 style="font-size:1.75rem;margin:6px 0 4px">${e.name}</h1><p class="muted">${e.main} · ${e.secondary}</p>${lottie(e)}<button class="btn full" style="margin:14px 0" onclick="state.anTab='anatomy';go('anatomy')">VER ANATOMÍA</button><div class="card"><div class="eyebrow">FUNCIÓN</div><h3>¿Para qué sirve?</h3><p class="muted" style="line-height:1.55">${e.function}</p></div><div class="sectiontitle"><h2>Técnica básica</h2></div>${e.tech.map((t,i)=>`<div class="callout"><b>${i+1}. ${t}</b></div>`).join('')}<div class="grid2" style="margin-top:14px"><div class="card metric"><b>${e.series}</b><span>Series</span></div><div class="card metric"><b>${e.reps}</b><span>Repeticiones</span></div><div class="card metric"><b>${e.rest}</b><span>Descanso</span></div><div class="card metric"><b>${e.level}</b><span>Nivel</span></div></div><button class="btn full" style="margin-top:14px" onclick="startWorkout(e.cat==='GYM'?'gym':'calis','${e.id}')">AÑADIR / INICIAR ENTRENAMIENTO</button>`}
function renderAnatomy(){let e=EX.find(x=>x.id===state.selected)||EX[0];let tabs=[['anatomy','ANATOMÍA'],['tech','TÉCNICA'],['errors','ERRORES'],['equipment','EQUIPO'],['variants','VARIANTES']];let body='';if(state.anTab==='anatomy')body=`<div class="bodymap"><div class="bodycard"><div class="sil"><i class="muscle m1"></i><i class="muscle m2"></i><i class="muscle m3"></i></div><span class="target">FRONTAL</span></div><div class="bodycard"><div class="sil"><i class="muscle m1"></i><i class="muscle m2"></i><i class="muscle m3"></i></div><span class="target">POSTERIOR</span></div></div><div class="legend"><span><i class="dot d1"></i>Principal</span><span><i class="dot d2"></i>Secundario</span><span><i class="dot d3"></i>Estabilizador</span></div><div class="card" style="margin-top:14px"><b>Principal</b><p>${e.main}</p><b>Secundarios</b><p>${e.secondary}</p><b>Estabilizadores</b><p>${e.stabilizers}</p><b>Función</b><p class="muted">${e.function}</p></div>`;if(state.anTab==='tech')body=`${lottie(e)}<div class="sectiontitle"><h2>Técnica detallada</h2></div>${e.tech.map((t,i)=>`<div class="callout"><b>Paso ${i+1}</b>${t}</div>`).join('')}`;if(state.anTab==='errors')body=`<div class="sectiontitle"><h2>Errores comunes</h2></div>${e.errors.map((x,i)=>`<div class="card" style="margin-bottom:10px"><div class="eyebrow">ERROR ${i+1}</div><h3>${x}</h3><p class="muted">Corrígelo reduciendo carga si es necesario y priorizando una ejecución estable, controlada y sin dolor.</p></div>`).join('')}`;if(state.anTab==='equipment')body=`<div class="lottiebox" style="height:240px"><div style="font-size:5rem">🧰</div></div><div class="card" style="margin-top:14px"><div class="eyebrow">EQUIPO ESPECÍFICO</div><h3>${e.equipment}</h3><p class="muted">Ajusta el material a tu altura y nivel. La estabilidad y un recorrido cómodo tienen prioridad sobre aumentar la carga.</p></div>`;if(state.anTab==='variants')body=`<div class="grid2">${e.variants.split(' · ').map((v,i)=>`<div class="card"><div class="art" style="height:120px;margin-bottom:10px"><div class="person"><i class="head"></i><i class="torso"></i><i class="limb a1"></i><i class="limb a2"></i><i class="limb l1"></i><i class="limb l2"></i></div></div><b>${v}</b><p class="muted">Variante ${i+1} de ${e.name}.</p></div>`).join('')}</div>`;$('anatomy').innerHTML=`${head(e.name,'detail')}<div class="eyebrow">ANÁLISIS ANATÓMICO Y TÉCNICO</div><div class="tabs" style="margin-top:12px">${tabs.map(t=>`<button class="tab ${state.anTab===t[0]?'active':''}" onclick="state.anTab='${t[0]}';renderAnatomy()">${t[1]}</button>`).join('')}</div><div class="anatomyview">${body}</div><button class="btn secondary full" style="margin-top:16px" onclick="go('detail')">VOLVER AL EJERCICIO</button>`}
function renderCalis(){ $('calis').innerHTML=`${head('Calistenia','more')}<div class="hero"><div class="eyebrow">MÓDULO INDEPENDIENTE</div><h1 style="font-size:1.65rem">Entrena con tu propio cuerpo</h1><p class="muted">Progresiones por nivel, circuitos y control de tiempo. No comparte planes con GYM.</p><button class="btn" onclick="startWorkout('calis')">INICIAR CALISTENIA</button></div><div class="sectiontitle"><h2>Niveles</h2></div>${[['beginner','Principiante'],['intermediate','Intermedio'],['advanced','Avanzado']].map(([k,n])=>`<div class="card" style="margin-bottom:12px"><span class="tag">${n.toUpperCase()}</span><h3>${n}</h3><p class="muted">${CAL[k].join(' · ')}</p><button class="btn secondary" onclick="alert('Nivel ${n} seleccionado')">VER PROGRAMA</button></div>`).join('')}<div class="sectiontitle"><h2>Ejercicios de calistenia</h2></div>${EX.filter(e=>e.cat==='CALISTENIA').map(exCard).join('')}`}
function renderProgress(){ $('progress').innerHTML=`${head('Progreso','home')}<div class="grid2"><div class="card"><div class="bigstat">18</div><span class="muted">sesiones</span></div><div class="card"><div class="bigstat">7</div><span class="muted">días de racha</span></div></div><div class="sectiontitle"><h2>Esta semana</h2></div><div class="card"><div class="row" style="align-items:end;height:180px">${[45,70,35,86,64,92,55].map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${v}%;background:linear-gradient(var(--cyan),#136ba5);border-radius:10px 10px 4px 4px"></div><small class="muted">${'LMXJVSD'[i]}</small></div>`).join('')}</div></div><div class="sectiontitle"><h2>Resumen</h2></div><div class="card"><div class="settingsrow"><span>Volumen estimado</span><b>12.450 kg</b></div><div class="settingsrow"><span>Tiempo entrenado</span><b>8 h 32 min</b></div><div class="settingsrow"><span>Ejercicios completados</span><b>126</b></div></div>`}
function renderMore(){ $('more').innerHTML=`${head('Más','home')}<div class="grid2"><div class="card quick" onclick="go('calis')"><div class="emoji">🤸</div><b>Calistenia</b></div><div class="card quick"><div class="emoji">❤️</div><b>Cardio</b></div><div class="card quick"><div class="emoji">📅</div><b>Calendario</b></div><div class="card quick"><div class="emoji">👤</div><b>Perfil</b></div></div><div class="sectiontitle"><h2>Ajustes</h2></div><div class="card"><div class="settingsrow"><span>Sonidos</span><div class="toggle on" onclick="this.classList.toggle('on')"><i></i></div></div><div class="settingsrow"><span>Temporizador automático</span><div class="toggle on" onclick="this.classList.toggle('on')"><i></i></div></div><div class="settingsrow"><span>Modo oscuro</span><div class="toggle on"><i></i></div></div></div>`}
function startWorkout(type,startId){let list=type==='gym'?EX.filter(e=>e.cat==='GYM').slice(0,5):EX.filter(e=>e.cat==='CALISTENIA');if(startId){let e=EX.find(x=>x.id===startId);list=[e,...list.filter(x=>x.id!==startId)]}state.workout={type,list,index:0,set:1,reps:0,paused:false};go('workout')}
function workoutUI(){let w=state.workout;if(!w)return '';let e=w.list[w.index];return `${head(w.type==='gym'?'Sesión GYM':'Sesión Calistenia',w.type==='gym'?'gym':'calis')}<div class="eyebrow">EJERCICIO ${w.index+1} DE ${w.list.length}</div><h1 style="margin:6px 0">${e.name}</h1>${lottie(e)}<div class="grid3" style="margin-top:14px"><div class="card metric"><b>${w.set}/${e.series}</b><span>Serie</span></div><div class="card metric"><b>${w.reps}</b><span>Reps</span></div><div class="card metric"><b>${e.rest}</b><span>Descanso</span></div></div><div class="row" style="margin-top:12px"><button class="btn secondary" style="flex:1" onclick="rep(-1)">−1</button><button class="btn" style="flex:2" onclick="rep(1)">+ REP</button><button class="btn secondary" style="flex:1" onclick="nextEx()">SIG.</button></div><button class="btn secondary full" style="margin-top:10px" onclick="state.workout.paused=!state.workout.paused;renderWorkout()">${w.paused?'CONTINUAR':'PAUSAR'}</button><div class="card" style="margin-top:14px"><div class="eyebrow">TÉCNICA</div><p>${e.tech[0]}</p><p class="muted">${e.tech[1]}</p></div>`}
function rep(n){if(!state.workout)return;state.workout.reps=Math.max(0,state.workout.reps+n);renderWorkout()}
function nextEx(){let w=state.workout;if(w.index<w.list.length-1){w.index++;w.set=1;w.reps=0;renderWorkout()}else{alert('Entrenamiento completado');state.workout=null;go('progress')}}
function renderWorkout(){$('workout').innerHTML=workoutUI()}
function render(id){({home:renderHome,gym:renderGym,exercises:renderExercises,progress:renderProgress,more:renderMore,detail:renderDetail,anatomy:renderAnatomy,calis:renderCalis,workout:renderWorkout}[id]||(()=>{}))()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.go));renderHome();
</script>
</body></html>

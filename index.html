<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4efe4" />
<title>Bingo - Escucha automática</title>
<style>
:root{
  --bg:#f4efe4; --card:#fffaf2; --ink:#1f1f1f; --muted:#777;
  --mark:#dedede; --green:#2e7d32; --red:#b71c1c; --amber:#a66a00;
  --blue:#245a9a;
}
*{box-sizing:border-box}
body{
  margin:0; padding:env(safe-area-inset-top) 12px 40px;
  font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Courier New",monospace;
  background:var(--bg); color:var(--ink);
}
.wrap{max-width:820px;margin:auto}
h1{text-align:center;font-size:24px;margin:18px 0 4px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.listen{
  position:sticky; top:0; z-index:10;
  background:rgba(244,239,228,.96); backdrop-filter:blur(8px);
  padding:10px 0 12px;
}
.panel{
  background:#fff;border:2px solid #222;border-radius:14px;padding:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.06)
}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{
  font:inherit;font-weight:800;border:1px solid #999;background:#fff;
  border-radius:11px;padding:11px 14px;min-height:44px;
}
#listenBtn.active{background:#ffe3e3;border-color:var(--red);color:var(--red)}
.status{text-align:center;font-weight:900;margin:10px 0 4px}
.last{text-align:center;font-size:22px;font-weight:900;min-height:30px}
.small{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
.alert{
  display:none;margin-top:10px;padding:10px;border-radius:10px;
  font-weight:900;text-align:center;border:2px solid #222;background:#fff
}
.history{
  margin-top:8px;font-size:13px;line-height:1.5;word-break:break-word;
}
.card{
  background:var(--card);border:2px solid #222;border-radius:14px;
  margin:14px 0;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)
}
.card-title{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:900;margin-bottom:8px}
.card-status{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:7px 0}
.num{
  min-height:54px;border:2px solid #333;background:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;position:relative;user-select:none;
}
.num.marked{background:var(--mark);color:#555;text-decoration:line-through}
.num.marked::after{content:"✕";position:absolute;font-size:36px;opacity:.52;color:#111}
.row.line-done .num{outline:3px solid var(--green)}
.card.bingo{outline:5px solid var(--red)}
.section-title{font-size:15px;font-weight:900;margin:16px 0 7px}
.keypad{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.key{
  min-height:38px;border:1px solid #aaa;border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px
}
.key.called{background:#ddd;text-decoration:line-through}
.unsupported{color:var(--red);font-weight:800}
@media(max-width:540px){
  .keypad{grid-template-columns:repeat(9,1fr)}
  .num{min-height:50px;font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎱 BINGO — ESCUCHA AUTOMÁTICA</h1>
  <div class="sub">Escucha los números, los marca en tus 5 cartones y controla línea y bingo.</div>

  <div class="listen">
    <div class="panel">
      <div class="controls">
        <button id="listenBtn" onclick="toggleListening()">🎤 Empezar escucha</button>
        <button onclick="undoLast()">↶ Deshacer último</button>
        <button onclick="resetAll()">Reiniciar</button>
      </div>
      <div class="status" id="status">Micrófono detenido</div>
      <div class="last" id="last">—</div>
      <div class="small" id="supportText">Pulsa “Empezar escucha” y permite el micrófono.</div>
      <div class="alert" id="alert"></div>
      <div class="history" id="history"></div>
    </div>
  </div>

  <div id="cards"></div>

  <div class="section-title">Teclado de respaldo 1–90</div>
  <div class="keypad" id="keypad"></div>
</div>

<script>
const cards = [
  {id:"1018", rows:[[14,30,43,64,80],[18,23,49,52,75],[6,27,58,79,85]]},
  {id:"1019", rows:[[4,25,34,61,71],[10,29,45,50,77],[8,36,57,66,90]]},
  {id:"1020", rows:[[16,32,41,62,84],[2,21,47,55,73],[5,38,59,68,89]]},
  {id:"1021", rows:[[7,26,45,64,74],[9,27,30,53,80],[19,48,59,79,85]]},
  {id:"1022", rows:[[11,35,41,63,71],[5,25,39,51,68],[18,49,55,73,81]]}
];

let called = JSON.parse(localStorage.getItem("bingoCalled") || "[]");
let listening = false;
let recognition = null;
let lastAlertKey = "";

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function save(){ localStorage.setItem("bingoCalled", JSON.stringify(called)); }
function uniquePush(n){
  if(n<1 || n>90) return false;
  if(!called.includes(n)){ called.push(n); save(); render(); announceIfNeeded(); return true; }
  return false;
}

function render(){
  const root = document.getElementById("cards");
  root.innerHTML = "";
  cards.forEach(card=>{
    const box=document.createElement("section"); box.className="card"; box.dataset.id=card.id;
    const title=document.createElement("div"); title.className="card-title";
    title.innerHTML=`<span>Cartón ${card.id}</span><span class="card-status" id="st-${card.id}"></span>`;
    box.appendChild(title);
    let total=0, anyLine=false;
    card.rows.forEach((row,r)=>{
      const rowEl=document.createElement("div"); rowEl.className="row";
      let rc=0;
      row.forEach(n=>{
        const d=document.createElement("div"); d.className="num"; d.textContent=n;
        if(called.includes(n)){ d.classList.add("marked"); rc++; total++; }
        d.onclick=()=>toggleNumber(n);
        rowEl.appendChild(d);
      });
      if(rc===5){ rowEl.classList.add("line-done"); anyLine=true; }
      box.appendChild(rowEl);
    });
    if(total===15) box.classList.add("bingo");
    root.appendChild(box);
    document.getElementById(`st-${card.id}`).textContent = `${total}/15` + (anyLine ? " · línea" : "");
  });

  const kp=document.getElementById("keypad"); kp.innerHTML="";
  for(let n=1;n<=90;n++){
    const k=document.createElement("div"); k.className="key"+(called.includes(n)?" called":""); k.textContent=n;
    k.onclick=()=>toggleNumber(n); kp.appendChild(k);
  }
  document.getElementById("history").textContent = called.length ? "Cantados: "+called.join(" · ") : "";
}

function toggleNumber(n){
  if(called.includes(n)) called = called.filter(x=>x!==n);
  else called.push(n);
  save(); render(); announceIfNeeded();
}

function undoLast(){
  if(!called.length) return;
  called.pop(); save(); render(); announceIfNeeded(true);
}

function resetAll(){
  if(confirm("¿Borrar todos los números cantados?")){
    called=[]; lastAlertKey=""; save(); render();
    document.getElementById("alert").style.display="none";
    document.getElementById("last").textContent="—";
  }
}

function lineProgress(){
  let best=null, completedLines=[], bingos=[];
  cards.forEach(card=>{
    let total=0;
    card.rows.forEach((row,r)=>{
      const hit=row.filter(n=>called.includes(n)).length;
      total+=hit;
      const missing=row.filter(n=>!called.includes(n));
      if(hit===5) completedLines.push({card:card.id,row:r+1});
      if(!best || hit>best.hit) best={card:card.id,row:r+1,hit,missing};
    });
    if(total===15) bingos.push(card.id);
  });
  return {best,completedLines,bingos};
}

function announceIfNeeded(silent=false){
  const {best,completedLines,bingos}=lineProgress();
  const alert=document.getElementById("alert");
  let msg="", key="";

  if(bingos.length){
    msg=`🚨 ¡BINGO! Cartón ${bingos[0]}`; key="B"+bingos[0];
  } else if(completedLines.length){
    const x=completedLines[0];
    msg=`✅ ¡LÍNEA! Cartón ${x.card} · fila ${x.row}`; key=`L${x.card}-${x.row}`;
  } else if(best && best.hit===4){
    msg=`⚠️ A 1 DE LÍNEA — Cartón ${best.card}: falta ${best.missing[0]}`;
    key=`A${best.card}-${best.row}-${best.missing[0]}`;
  }

  if(msg){
    alert.style.display="block"; alert.textContent=msg;
    if(!silent && key!==lastAlertKey){
      speak(msg.replace(/[🚨✅⚠️]/g,""));
      lastAlertKey=key;
    }
  }else{
    alert.style.display="none"; alert.textContent="";
    lastAlertKey="";
  }
}

function speak(text){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="es-ES"; u.rate=1.05;
    speechSynthesis.speak(u);
  }
}

function parseNumbers(text){
  text = text.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\w\s-]/g," ");

  const found = [];
  const digitMatches = text.match(/\b\d{1,2}\b/g) || [];
  digitMatches.forEach(x=>{ const n=parseInt(x,10); if(n>=1&&n<=90) found.push(n); });

  const units={uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9};
  const teens={diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19};
  const twenties={veinte:20,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29};
  const tens={treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90};
  const words=text.split(/\s+/).filter(Boolean);

  for(let i=0;i<words.length;i++){
    let w=words[i], n=null;
    if(units[w]) n=units[w];
    else if(teens[w]) n=teens[w];
    else if(twenties[w]) n=twenties[w];
    else if(tens[w]){
      n=tens[w];
      if(words[i+1]==="y" && units[words[i+2]]){ n+=units[words[i+2]]; i+=2; }
    }
    if(n && n<=90) found.push(n);
  }
  return [...new Set(found)];
}

function processTranscript(text){
  document.getElementById("last").textContent = "🎧 "+text;
  const nums=parseNumbers(text);
  let added=[];
  nums.forEach(n=>{ if(uniquePush(n)) added.push(n); });
  if(added.length){
    document.getElementById("last").textContent = "✅ Detectado: "+added.join(", ");
  }
}

function initRecognition(){
  const support=document.getElementById("supportText");
  if(!SR){
    support.innerHTML='<span class="unsupported">Este navegador no ofrece reconocimiento de voz continuo. Usa el teclado de respaldo o prueba Safari/Chrome actualizado.</span>';
    document.getElementById("listenBtn").disabled=true;
    return;
  }
  recognition=new SR();
  recognition.lang="es-ES";
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.maxAlternatives=3;

  recognition.onstart=()=>{
    listening=true;
    const b=document.getElementById("listenBtn"); b.classList.add("active"); b.textContent="⏹ Detener escucha";
    document.getElementById("status").textContent="🟢 ESCUCHANDO…";
  };

  recognition.onresult=(e)=>{
    let texts=[];
    for(let i=e.resultIndex;i<e.results.length;i++){
      for(let a=0;a<Math.min(3,e.results[i].length);a++) texts.push(e.results[i][a].transcript);
    }
    // Preferimos la primera alternativa, pero si no trae número probamos las siguientes.
    let chosen=texts[0]||"";
    if(parseNumbers(chosen).length===0){
      const alt=texts.find(t=>parseNumbers(t).length>0);
      if(alt) chosen=alt;
    }
    processTranscript(chosen);
  };

  recognition.onerror=(e)=>{
    document.getElementById("status").textContent="⚠️ Micrófono: "+e.error;
    if(e.error==="not-allowed" || e.error==="service-not-allowed") listening=false;
  };

  recognition.onend=()=>{
    if(listening){
      try{ recognition.start(); }catch(_){}
    }else{
      const b=document.getElementById("listenBtn"); b.classList.remove("active"); b.textContent="🎤 Empezar escucha";
      document.getElementById("status").textContent="Micrófono detenido";
    }
  };
}

function toggleListening(){
  if(!recognition) return;
  if(listening){
    listening=false;
    try{ recognition.stop(); }catch(_){}
  }else{
    try{ recognition.start(); }
    catch(e){ document.getElementById("status").textContent="Pulsa otra vez para iniciar."; }
  }
}

render();
announceIfNeeded(true);
initRecognition();
</script>
</body>
</html>

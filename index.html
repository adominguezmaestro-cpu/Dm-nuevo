function miniAna(e){let hi=e.group==='Pecho'?'<ellipse cx="25" cy="22" rx="10" ry="6" fill="#ff565d" opacity=".9"/>':e.group==='Piernas'?'<ellipse cx="19" cy="46" rx="5" ry="12" fill="#ff565d" opacity=".9"/><ellipse cx="31" cy="46" rx="5" ry="12" fill="#ff565d" opacity=".9"/>':'<ellipse cx="25" cy="33" rx="7" ry="11" fill="#ff565d" opacity=".9"/>';return `<svg viewBox="0 0 50 70"><circle cx="25" cy="8" r="5" fill="none" stroke="#9eb0ba" stroke-width="1.4"/><path d="M25 13v28M25 20L13 29M25 20L37 29M25 41L17 64M25 41L33 64" stroke="#9eb0ba" stroke-width="2" fill="none" stroke-linecap="round"/>${hi}</svg>`}
function home(){stack=[];render(`<div class="page"><div class="hero"><div class="heroHead"><div class="heroLogo">DM <span style="color:#19a8ff">FITNESS</span><small>CUERPO FUERTE · MENTE LIBRE</small></div><div style="font-size:22px">⚙</div></div><div class="heroCopy"><h2>Hola</h2><p>Disciplina hoy, resultados mañana.</p></div></div><div class="level"><div class="levelRow"><div><small>Nivel actual</small><br><b>INTERMEDIO</b></div><small>Semana 3 de 12</small></div><div class="bar"><i></i></div></div><div class="stats4">${[['🔥','3','Entrenos esta semana'],['▥','48','Minutos totales'],['🏆','320','Calorías aprox.'],['★','15','Días de racha']].map(x=>`<div class="stat"><div class="ico">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><button class="primary" onclick="startWorkout('squat')">▶ &nbsp; INICIAR ENTRENAMIENTO</button><div class="tiles"><button class="tile" onclick="programs()"><b>▣</b><small>Programas</small></button><button class="tile" onclick="exercises()"><b>↔</b><small>Ejercicios</small></button><button class="tile" onclick="calendarPage()"><b>▦</b><small>Calendario</small></button><button class="tile" onclick="measures()"><b>⌁</b><small>Medidas</small></button></div><div class="quote">“La constancia siempre gana.”</div></div>`,'home',false)}
function rowEx(e){return `<div class="exRow" data-name="${e.name.toLowerCase()}"><div class="thumb" style="background-image:url('${IMG[e.img]}')"></div><div onclick="detail('${e.id}')"><b>${e.name}</b><small>${e.group}</small></div><div class="miniAna" onclick="anatomy('${e.id}')">${miniAna(e)}</div><div class="arr" onclick="detail('${e.id}')">›</div></div>`}function exercises(group=filters){filters=group;const arr=group==='Todos'?EX:EX.filter(e=>e.group===group);render(`${head('EJERCICIOS')}<div class="page"><input class="search" placeholder="⌕  Buscar ejercicio..." oninput="searchEx(this.value)"><div class="chips">${['Todos','Piernas','Pecho','Core'].map(g=>`<button class="chip ${g===group?'on':''}" onclick="exercises('${g}')">${g}</button>`).join('')}</div><div class="exList" id="exList">${arr.map(rowEx).join('')}</div></div>`,'train')}function searchEx(v){v=v.toLowerCase();document.querySelectorAll('.exRow').forEach(x=>x.style.display=x.dataset.name.includes(v)?'grid':'none')}
function detail(id){const e=EX.find(x=>x.id===id);render(`${head(e.name.toUpperCase(),e.group+' · Fuerza básica')}<div class="page"><div class="detailTabs"><button class="on">Ejercicio</button><button>Músculos</button><button>Consejos</button><button>Historial</button></div><div class="detailHero" style="background-image:url('${IMG[e.img]}')"><div class="anatop"><div class="anmini">${miniAna(e)}</div><div class="anmini">${miniAna(e)}</div></div><div class="detailName"><h2>${e.name}</h2><small>${e.mus.join(' · ')}</small></div></div><div class="metrics"><div class="metric"><small>Series</small><b>${e.sets}</b></div><div class="metric"><small>Reps</small><b>${e.timed?e.reps+' s':e.reps}</b></div><div class="metric"><small>Peso</small><b>—</b></div><div class="metric"><small>Descanso</small><b>${e.rest}s</b></div></div><div class="btnRow"><button class="outline" onclick="anatomy('${e.id}')">◉ VER ANATOMÍA</button><button class="primary" onclick="startWorkout('${e.id}')">▶ ENTRENAR</button></div><div class="tip">ⓘ &nbsp; ${e.tip}</div></div>`,'train')}
function anatomy(id){const e=EX.find(x=>x.id===id);render(`${head('ANATOMÍA',e.name)}<div class="page"><div class="anatomyBtns"><button class="on">Vista frontal</button><button>Vista posterior</button><button>Vista 3D</button></div><div class="anatomyHero"><div class="legendBox"><div><span class="dot" style="background:#ff565d"></span><b>Músculo principal</b> · ${e.mus[0]}</div><div><span class="dot" style="background:#ff9d2f"></span><b>Secundarios</b> · ${e.mus.slice(1).join(', ')}</div><div><span class="dot" style="background:#19a8ff"></span><b>Estabilizadores</b> · Core y musculatura postural</div></div></div><div class="note" style="margin-top:10px"><div style="font-size:22px">ⓘ</div><div><b>${e.mus[0]}</b><small>Zona principal implicada en el movimiento. Mantén la técnica limpia para trabajarla correctamente.</small></div></div></div>`,'train')}
function startWorkout(id){clearInterval(tick);run={i:Math.max(0,EX.findIndex(e=>e.id===id)),left:30,paused:false};renderWorkout();tick=setInterval(()=>{if(run&&!run.paused){run.left--;if(run.left<=0)nextEx();else updateTimer()}},1000)}function renderWorkout(){const e=EX[run.i];render(`${head('ENTRENAMIENTO','Nivel 1 · Fuerza básica')}<div class="page"><div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px"><div><h2 style="margin:0;font-size:27px">${e.name.toUpperCase()}</h2><small style="color:#b8c6cd">${e.mus.join(', ')}</small></div><b style="color:#19a8ff">${run.i+1}/${EX.length}</b></div><div class="bar"><i style="width:${((run.i+1)/EX.length)*100}%"></i></div><div class="trainImg" style="background-image:url('${IMG[e.img]}')"><div class="trainTopAna"><div class="anmini">${miniAna(e)}</div><div class="anmini">${miniAna(e)}</div></div></div><div class="timerRing"><div><b id="seconds">${run.left}</b><small>segundos</small></div></div><div class="trainControls"><button class="roundBtn" onclick="togglePause()">Ⅱ<br><small>Pausa</small></button><button class="roundBtn main" onclick="togglePause()" id="pauseMain">Ⅱ</button><button class="roundBtn" onclick="nextEx()">▶<br><small>Siguiente</small></button></div><div class="tip">ⓘ &nbsp; ${e.tip}</div><button class="outline" style="width:100%;margin-top:8px" onclick="anatomy('${e.id}')">◉ VER ANATOMÍA</button></div>`,'train')}function updateTimer(){const el=$('#seconds');if(el)el.textContent=run.left}function togglePause(){run.paused=!run.paused;const p=$('#pauseMain');if(p)p.textContent=run.paused?'▶':'Ⅱ'}function nextEx(){run.i=(run.i+1)%EX.length;run.left=30;renderWorkout()}
function programs(){const p=[['squat','Nivel 1 – Iniciación','4 semanas · 3 días/semana','Aprende la técnica y crea el hábito.'],['pushup','Nivel 2 – Fuerza básica','6 semanas · 3-4 días/semana','Gana fuerza y resistencia.'],['lunge','Nivel 3 – Intermedio','8 semanas · 4 días/semana','Mejora el rendimiento y el control.'],['plank','Nivel 4 – Avanzado','12 semanas · 4-5 días/semana','Lleva tu entrenamiento al siguiente nivel.']];render(`${head('PROGRAMAS')}<div class="page"><div class="chips"><button class="chip on">Todos</button><button class="chip">Principiante</button><button class="chip">Intermedio</button><button class="chip">Avanzado</button></div>${p.map(x=>`<div class="program"><div class="pimg" style="background-image:url('${IMG[x[0]]}')"></div><div><b>${x[1]}</b><small>${x[2]}</small><small>${x[3]}</small></div><div class="arr">›</div></div>`).join('')}</div>`,'programs')}
function calendarPage(){let days=[];for(let i=1;i<=30;i++)days.push(`<div class="day ${[7,10].includes(i)?'done':i===15?'rest':i===9?'today':''}">${i}</div>`);render(`${head('CALENDARIO')}<div class="page"><h2 style="text-align:center;margin:12px 0">Septiembre 2026</h2><div class="calendar">${['L','M','X','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('')}${days.join('')}</div><div class="legend"><span><i class="dot" style="background:#28d17c"></i>Entrenado</span><span><i class="dot" style="background:#19a8ff"></i>Hoy</span><span><i class="dot" style="background:#ff565d"></i>Descanso</span></div><div class="note"><div style="font-size:24px">▦</div><div><b>Mantén tu racha</b><small>La disciplina de hoy construye el resultado de mañana.</small></div></div></div>`,'more')}
function progress(){render(`${head('PROGRESO')}<div class="page"><div class="tabs3"><button class="on">Resumen</button><button>Entrenamientos</button><button>Medidas</button><button>Calorías</button></div><div class="bigStats">${[['▥','12','Entrenamientos total'],['◴','240','Minutos totales'],['🔥','1.520','Calorías aprox.'],['★','15','Días de racha']].map(x=>`<div class="stat"><div class="ico">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><div class="chart"><b>Actividad semanal (minutos)</b><div class="bars">${[18,38,57,49,30,42,22].map(h=>`<div class="barV" style="height:${h*2}px"></div>`).join('')}</div><div class="labels">${['L','M','X','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="quote">“Pequeños pasos, grandes cambios.”</div></div>`,'progress')}
function measures(){render(`${head('MEDIDAS')}<div class="page"><div class="chips"><button class="chip on">Peso</button><button class="chip">Cintura</button><button class="chip">Pecho</button><button class="chip">Brazos</button><button class="chip">Piernas</button></div><div class="chart"><b>Peso (kg)</b><div class="linechart"><svg viewBox="0 0 360 170"><g stroke="#294655"><path d="M20 30H340M20 70H340M20 110H340M20 150H340"/></g><path d="M35 38L95 60L155 82L215 101L275 117L330 126" fill="none" stroke="#19a8ff" stroke-width="4"/></svg></div></div><div class="measureCards"><div class="measure"><small>Peso actual</small><b>117,5 kg</b></div><div class="measure"><small>Objetivo</small><b>90 kg</b></div></div><div class="quote">“Tú puedes. Sigue así.”</div></div>`,'more')}
function more(){render(`${head('MÁS')}<div class="page settings">${[['👤','Perfil','Datos personales'],['🔔','Notificaciones','Recordatorios de entrenamiento'],['◴','Temporizador','Sonido y duración'],['◐','Apariencia','Tema oscuro'],['🌐','Idioma','Español'],['ⓘ','Acerca de','DM Fitness v4.0']].map(x=>`<div class="setting"><div class="si">${x[0]}</div><div><b>${x[1]}</b><small>${x[2]}</small></div><div>›</div></div>`).join('')}<div class="brand" style="margin-top:28px">DM <span>FITNESS</span><div style="font-size:9px;letter-spacing:3px;margin-top:5px">CUERPO FUERTE · MENTE LIBRE</div></div></div>`,'more')}
setInterval(()=>{const d=new Date(),c=$('#clock');if(c)c.textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})},1000);home();
</script></body></html>

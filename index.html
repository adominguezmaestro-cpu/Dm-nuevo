/* ===== DM FITNESS · PREMIUM GLASS 2026 ===== */
:root{
  --bg:#030a10;--bg2:#07131b;--card:#0a1821;--card2:#0d202b;--line:#173646;
  --blue:#17a9ff;--blue2:#68d4ff;--text:#f7fbff;--muted:#8ea6b4;
  --green:#37df8c;--red:#ff5e68;--yellow:#ffc857;--r:22px;
}
html,body{background:#02070b;color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Arial,sans-serif}
.app{
  max-width:430px;background:
    radial-gradient(circle at 85% -5%,rgba(23,169,255,.16),transparent 28%),
    radial-gradient(circle at 0% 20%,rgba(42,104,140,.13),transparent 28%),
    linear-gradient(180deg,#06131b 0%,#030a10 64%,#02070b 100%);
  box-shadow:0 0 80px rgba(0,0,0,.8)
}
.status{height:34px;color:#d9e8f0;font-size:11px;letter-spacing:.2px}
.top{
  min-height:58px;background:rgba(3,10,16,.82);border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)
}
.top h1{font-size:17px;letter-spacing:.1px}.back{color:var(--blue2)}
.brand{padding:16px 0 14px}.brand .dm{font-size:43px;letter-spacing:-4px}.brand .fit{font-size:27px;color:#fff;margin-left:7px}
.brand small{color:var(--blue2);font-weight:800;letter-spacing:2px}
.hero{height:390px;border-radius:28px;border:1px solid rgba(104,212,255,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 24px 60px rgba(0,0,0,.35)}
.hero:after{background:linear-gradient(180deg,rgba(0,0,0,.02) 25%,rgba(3,10,16,.08) 50%,rgba(3,10,16,.96) 100%)}
.heroCopy{bottom:20px}.heroCopy h2{font-size:29px;letter-spacing:-.6px;font-style:normal;font-weight:950}
.primary{border-radius:15px;background:linear-gradient(135deg,#0d8ff3 0%,#19b9ff 100%);padding:15.5px;box-shadow:0 12px 28px rgba(23,169,255,.25);letter-spacing:.2px}
.quick{gap:11px}.quickCard,.plan,.groupRow,.info,.trainCard,.stat,.chart,.moreCard,.setting,.nextCard{
  background:linear-gradient(145deg,rgba(15,37,50,.93),rgba(6,19,28,.95));
  border:1px solid rgba(104,212,255,.17);box-shadow:inset 0 1px rgba(255,255,255,.02),0 10px 28px rgba(0,0,0,.16)
}
.quickCard{min-height:126px;border-radius:20px}.quickCard .ico{width:44px;height:44px}.quickCard b{font-size:14px;letter-spacing:.4px}.quickCard small{color:#91aab8}
.quote{color:#718995}
.sectionTitle h1{font-size:28px;letter-spacing:-.7px}.sectionTitle small{color:#7fa0b2}
.seg,.modes{background:rgba(255,255,255,.025);padding:4px;border-radius:14px;gap:4px}
.seg button,.chips button,.modes button,.tabs button{border-color:rgba(104,212,255,.16);background:rgba(13,32,43,.85);border-radius:11px}
.seg button.on,.chips button.on,.tabs button.on{background:linear-gradient(135deg,#0c8eef,#18b9ff);box-shadow:0 6px 16px rgba(23,169,255,.22)}
.modes button.on{background:#102d3c;color:#fff;box-shadow:inset 0 -2px var(--blue)}
.plan{border-radius:18px;min-height:94px}.planArt{height:94px;background:radial-gradient(circle at 50% 25%,#1a3949,#08151d 70%)}
.search{height:46px;border-radius:14px;background:rgba(8,24,34,.92);border-color:rgba(104,212,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.chips{padding:11px 0}.chips button{padding:9px 13px}
.groupRow{border-radius:17px;min-height:76px}.groupThumb{height:76px;background:linear-gradient(145deg,#edf4f6,#dbe7ec)}
.exerciseGrid{gap:11px}.exTile{border-radius:18px;border:1px solid rgba(104,212,255,.18);background:#eef3f6;box-shadow:0 12px 26px rgba(0,0,0,.18)}
.exTile .art{height:134px;background:radial-gradient(circle at 50% 20%,#fff,#e8eef2 70%)}
.exTile b{font-size:11.5px}.detail h1{font-size:29px;letter-spacing:-.7px}.musLine{color:#86a6b7}
.motionCard{height:310px;border-radius:22px;border:1px solid rgba(104,212,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.22);background:radial-gradient(circle at 50% 20%,#fff,#e7eef2 72%)}
.motionLabel{left:14px;bottom:12px;background:rgba(3,10,16,.84);backdrop-filter:blur(8px);padding:7px 11px}
.poseCard{border-radius:16px;border-color:#d2dfe5}.poseCard b{padding:8px}
.tabs{padding:4px;background:rgba(255,255,255,.025);border-radius:14px}.muscles{border-radius:18px;border-color:rgba(104,212,255,.16);background:linear-gradient(145deg,#0d222e,#081821)}
.info{border-radius:18px;padding:14px}.info h3{color:var(--blue2);font-size:13px}.step{font-size:10px;line-height:1.5}.step i{background:linear-gradient(135deg,#0c8eef,#18b9ff)}
.trainProgress{height:7px;background:#0d2937}.trainProgress i{background:linear-gradient(90deg,#0c8eef,#38c9ff)}
.trainCard{border-radius:22px;padding:13px}.trainCard h2{font-size:22px}.trainMotion{height:260px;border-radius:17px;background:radial-gradient(circle at 50% 20%,#fff,#e7eef2 72%)}
.ring{width:126px;height:126px;background:conic-gradient(var(--blue) var(--pct),#123445 0);box-shadow:0 0 30px rgba(23,169,255,.14)}
.ring:before{width:102px;height:102px;background:#06141c}.ringInner b{font-size:40px}.countBtns button{border-color:rgba(104,212,255,.22);background:#0b202b}.countBtns .pause{background:linear-gradient(135deg,#0c8eef,#18b9ff);box-shadow:0 8px 20px rgba(23,169,255,.22)}
.metric{border-radius:14px;background:#091b25;border-color:rgba(104,212,255,.15)}
.nextCard{border-radius:16px}.restOverlay{background:rgba(1,6,10,.96);backdrop-filter:blur(8px)}.restRing{border-color:#123747;border-top-color:#22b9ff;box-shadow:0 0 40px rgba(23,169,255,.14)}
.stat{border-radius:18px}.stat b{font-size:24px}.chart{border-radius:20px;padding:14px}
.moreCard,.setting{border-radius:17px}.calendar{gap:6px}.day{border-radius:11px;background:#081a24;border-color:rgba(104,212,255,.13)}.day.done{background:linear-gradient(145deg,#0b4767,#0d5b80);box-shadow:0 0 0 1px rgba(23,169,255,.15)}
.nav{height:80px;background:rgba(2,8,12,.92);border-top:1px solid rgba(104,212,255,.12);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)}
.nav button{font-size:8px;color:#708994;transition:.2s}.nav button.on{color:#36c4ff}.nav button.on svg{filter:drop-shadow(0 0 6px rgba(23,169,255,.45))}
.toast{background:#0d2632;border-color:rgba(104,212,255,.22);box-shadow:0 10px 25px rgba(0,0,0,.3)}
@media(max-width:370px){.hero{height:345px}.trainMotion{height:225px}}

/* ===== DM FITNESS · HUMAN MOTION 2.5D ===== */
.motionCard{height:330px;background:radial-gradient(circle at 50% 25%,#fefefe,#edf2f5 62%,#e3eaee);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.motionStage .pose svg,.trainMotion .pose svg,.poseCard svg,.planArt svg,.groupThumb svg,.exTile .art svg{filter:drop-shadow(0 12px 10px rgba(0,0,0,.14))}
.motionStage .p0,.motionStage .p1,.trainMotion .p0,.trainMotion .p1{transform-origin:50% 72%}
.motionStage .p0,.trainMotion .p0{animation:humanPoseA var(--cad,2.8s) cubic-bezier(.45,0,.3,1) infinite}
.motionStage .p1,.trainMotion .p1{animation:humanPoseB var(--cad,2.8s) cubic-bezier(.45,0,.3,1) infinite}
@keyframes humanPoseA{0%,38%{opacity:1;transform:scale(1)}48%,90%{opacity:.08;transform:scale(.985)}100%{opacity:1;transform:scale(1)}}
@keyframes humanPoseB{0%,38%{opacity:.08;transform:scale(.985)}48%,90%{opacity:1;transform:scale(1)}100%{opacity:.08;transform:scale(.985)}}
.motionLabel{background:rgba(5,19,29,.88);backdrop-filter:blur(8px);letter-spacing:.7px}

.anatomyBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(23,169,255,.55);background:linear-gradient(180deg,#0c2736,#091c28);color:#eaf7ff;border-radius:13px;padding:12px;margin:10px 0;font-weight:900;font-size:10px}.anatomyBtn svg{width:19px;height:19px}.anatomyPanel{border:1px solid #2a5065;background:linear-gradient(180deg,#0b202d,#071721);border-radius:18px;padding:13px;margin-top:10px}.anatomyHero{background:linear-gradient(180deg,#f8fbfc,#e9f0f3);border-radius:15px;padding:8px;min-height:330px;display:grid;place-items:center}.anatomyHero svg{width:100%;max-width:320px;height:330px}.anatomyLegend{display:grid;gap:8px;margin-top:11px}.legendRow{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start;font-size:10px;color:#d9e7ee}.legendDot{width:10px;height:10px;border-radius:50%;margin-top:2px}.legendRow small{display:block;color:#8fa7b5;font-size:8px;margin-top:2px}.anatomyToggle{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.anatomyToggle button{border:1px solid #2b5166;background:#081c28;color:#a9bdc8;border-radius:10px;padding:10px;font-size:9px}.anatomyToggle button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.trainCard{position:relative}.trainAnatomy{position:absolute;right:12px;top:58px;width:66px;height:92px;border-radius:12px;background:rgba(4,17,25,.78);border:1px solid rgba(104,212,255,.35);padding:4px;z-index:4;backdrop-filter:blur(8px)}.trainAnatomy svg{width:100%;height:100%}.trainCard .musLine{padding-right:72px}.trainVisual{margin-top:8px}.trainMotion{background:radial-gradient(circle at 50% 25%,#fff,#edf2f5 68%,#e3eaee)}

function save(){localStorage.setItem('dmfit2026',JSON.stringify(S))}function fmt(s){s=Math.max(0,Math.round(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

function nav(){const items=[['home','Inicio','home'],['gym','GYM','gym'],['exercise','Ejercicios','ex'],['chart','Progreso','progress'],['more','Más','more']];$('#nav').innerHTML=items.map(([ic,t,k])=>`<button class="${active===k?'on':''}" onclick="${k==='home'?'home()':k==='gym'?'gym()':k==='ex'?'catalog()':k==='progress'?'progress()':'more()'}">${icon(ic)}${t}</button>`).join('')}

function head(title,sub='',backFn='back()'){return `<div class="top"><button class="back" onclick="${backFn}">‹</button><div style="flex:1"><h1>${title}</h1>${sub?`<div style="text-align:center;font-size:8px;color:#8fa8b6">${sub}</div>`:''}</div><button class="plain"></button></div>`}

function exerciseDetail(id){const e=EX.find(x=>x.id===id);render(`${head('Ejercicio','','back()')}<div class="page detail"><h1>${e.name}</h1><div class="musLine">${e.mus.join(' · ')}</div><div class="humanBadge"><i></i> ILUSTRACIÓN TÉCNICA 2.5D · MOVIMIENTO HUMANO</div><div class="motionCard" style="--cad:${S.cadence}s"><div class="motionStage"><div class="pose p0">${poseSVG(e.kind,0)}</div><div class="pose p1">${poseSVG(e.kind,1)}</div></div><div class="motionArrow">${motionArrow()}</div><div class="motionLabel">MOVIMIENTO GUIADO</div></div><div class="techStrip"><div class="techFrame"><div class="v">${poseSVG(e.kind,0)}</div><b><span class="n">1</span>Posición inicial</b><small>Colócate estable y prepara el movimiento.</small></div><div class="techFrame"><div class="v">${poseSVG(e.kind,.35)}</div><b><span class="n">2</span>Recorrido</b><small>Inicia el gesto de forma lenta y controlada.</small></div><div class="techFrame"><div class="v">${poseSVG(e.kind,1)}</div><b><span class="n">3</span>Posición final</b><small>Completa el rango sin perder la postura.</small></div><div class="techFrame"><div class="v">${poseSVG(e.kind,.65)}</div><b><span class="n">4</span>Regreso</b><small>Vuelve con control a la posición inicial.</small></div></div><button class="anatomyBtn" onclick="anatomyView('${id}',false)">🫀 &nbsp; VER ANATOMÍA</button><div class="muscles">${e.mus.slice(0,3).map((m,i)=>`<div class="muscle">${muscleSVG(i)}<small>${m}</small></div>`).join('')}</div><div class="info"><h3>Ejecución correcta</h3>${['Colócate estable antes de comenzar.','Realiza el recorrido de forma controlada.','Mantén el core activo y evita impulsos.','Respira y conserva una técnica limpia.'].map((x,i)=>`<div class="step"><i>${i+1}</i><span>${x}</span></div>`).join('')}</div><button class="primary" onclick="startWorkout(['${id}'])">▶ &nbsp; ENTRENAR ESTE EJERCICIO</button></div>`,'ex')}

function fullAnatomySVG(e,back=false){const g=e.group||'';let zone='torso';if(g==='Piernas')zone='legs';else if(g==='Espalda')zone='back';else if(g==='Hombros'||g==='Brazos')zone='arms';else if(g==='Core')zone='core';else if(g==='Full Body')zone='full';const red='#ff554f',orange='#ff9948',blue='#55bff7',base='#a7b5bd';return `<svg viewBox="0 0 220 360" aria-label="Anatomía ${back?'posterior':'frontal'}"><defs><linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce4e8"/><stop offset=".5" stop-color="#9eafb8"/><stop offset="1" stop-color="#748892"/></linearGradient><filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".18"/></filter></defs><g filter="url(#soft)" stroke="#5f7480" stroke-width="1.6"><ellipse cx="110" cy="31" rx="22" ry="27" fill="url(#bodyG)"/><path d="M91 58Q110 48 129 58L143 126Q138 168 129 196L126 327H109L107 203L103 327H86L89 196Q79 164 77 126Z" fill="url(#bodyG)"/><path d="M82 74L45 157L58 163L94 102M138 74L175 157L162 163L126 102" fill="none" stroke="url(#bodyG)" stroke-width="22" stroke-linecap="round"/></g>${zone==='torso'||zone==='full'?`<path d="M90 72Q110 61 130 72L127 113Q110 124 93 113Z" fill="${red}" opacity=".9"/><path d="M94 116Q110 110 126 116L123 156Q110 164 97 156Z" fill="${zone==='full'?orange:blue}" opacity=".7"/>`:''}${zone==='back'?`<path d="M91 70Q110 59 129 70L132 125Q110 140 88 125Z" fill="${red}" opacity=".9"/><path d="M98 126H122L124 166H96Z" fill="${orange}" opacity=".75"/>`:''}${zone==='arms'||zone==='full'?`<path d="M76 82L57 129L69 134L91 93Z" fill="${red}" opacity=".9"/><path d="M144 82L163 129L151 134L129 93Z" fill="${red}" opacity=".9"/><path d="M53 132L44 158L58 163L68 137Z" fill="${orange}" opacity=".8"/><path d="M167 132L176 158L162 163L152 137Z" fill="${orange}" opacity=".8"/>`:''}${zone==='legs'||zone==='full'?`<path d="M88 186L105 186L103 251L85 251Z" fill="${red}" opacity=".9"/><path d="M111 186L128 186L131 251L113 251Z" fill="${red}" opacity=".9"/><path d="M86 254L1 function startWorkout(ids,kind='gym'){clearInterval(timer);run={kind,ids,i:0,set:1,rep:0,paused:false,resting:false,started:Date.now()};localStorage.setItem('dmfit_active',JSON.stringify(run));renderWorkout();startCounter()}
function currentEx(){return EX.find(x=>x.id===run.ids[run.i])||CALI[run.i%CALI.length]}
function renderWorkout(){if(!run)return;const e=currentEx(),pct=((run.i+(run.set-1)/e.sets)/run.ids.length)*100,rpct=e.timed?(run.rep/e.reps*360):(run.rep/e.reps*360),next=EX.find(x=>x.id===run.ids[run.i+1]);render(`${head('Entrenamiento',`${run.kind==='cali'?'CALISTENIA':'GYM'} · ${LEVELS[S.level]}`,'pauseRun()')}<div class="page"><div style="font-size:10px;color:#b7c7cf">Ejercicio ${run.i+1} de ${run.ids.length}</div><div class="trainProgress"><i style="width:${Math.max(3,pct)}%"></i></div><div class="trainCard"><h2>${e.name}</h2><div class="musLine">${e.mus.slice(0,3).join(' · ')}</div><button class="trainAnatomy" onclick="anatomyView('${e.id}',false)" aria-label="Ver anatomía">${muscleSVG(0)}</button><div class="trainVisual"><div class="trainMotion" style="--cad:${S.cadence}s"><div class="pose p0">${poseSVG(e.kind,0)}</div><div class="pose p1">${poseSVG(e.kind,1)}</div></div><div class="counter"><div class="ring" id="ring" style="--pct:${rpct}deg"><div class="ringInner"><small>${e.timed?'TIEMPO':'REPETICIÓN'}</small><b id="repnum">${run.rep}</b><em>/ ${e.reps}${e.timed?'s':''}</em></div></div><div class="series">SERIE ${run.set} / ${e.sets}</div><div class="countBtns"><button onclick="adjustRep(-1)">−</button><button class="pause" id="pausebtn" onclick="toggleRun()">${run.paused?'▶':'Ⅱ'}</button><button onclick="adjustRep(1)">+</button></div></div></div></div><button class="anatomyBtn" onclick="anatomyView('${e.id}',false)">🫀 &nbsp; VER ANATOMÍA</button><div class="metrics"><div class="metric" onclick="weightChange('${e.id}',2.5)"><small>PESO</small><b id="kg">${S.weights[e.id]||0} kg</b></div><div class="metric"><small>RITMO</small><b>${S.cadence}s</b></div><div class="metric"><small>DESCANSO</small><b>${e.rest}s</b></div></div>${next?`<div class="nextCard"><div class="mini">${poseSVG(next.kind,1)}</div><div><small>Siguiente ejercicio</small><b>${next.name}</b></div><div class="arr">›</div></div>`:''}</div>`,'gym',false);localStorage.setItem('dmfit_active',JSON.stringify(run))}
function startCounter(){clearInterval(timer);if(!run||run.paused||run.resting)return;const e=currentEx(),ms=e.timed?1000:Math.max(1500,S.cadence*1000);timer=setInterval(()=>{if(!run||run.paused||run.resting)return;run.rep++;const n=$('#repnum'),r=$('#ring');if(n)n.textContent=run.rep;if(r)r.style.setProperty('--pct',(run.rep/e.reps*360)+'deg');localStorage.setItem('dmfit_active',JSON.stringify(run));if(run.rep>=e.reps){clearInterval(timer);beep();setTimeout(finishSet,350)}},ms)}
function toggleRun(){if(!run)return;run.paused=!run.paused;renderWorkout();if(!run.paused)startCounter()}function pauseRun(){if(run){run.paused=true;localStorage.setItem('dmfit_active',JSON.stringify(run))}home()}
function adjustRep(d){if(!run)return;const e=currentEx();run.rep=Math.max(0,Math.min(e.reps,run.rep+d));renderWorkout();startCounter()}function weightChange(id,d){S.weights[id]=Math.max(0,(S.weights[id]||0)+d);save();const x=$('#kg');if(x)x.textContent=S.weights[id]+' kg'}
function finishSet(){const e=currentEx();S.logs.push({date:new Date().toISOString(),kind:run.kind,id:e.id,reps:e.reps,kg:S.weights[e.id]||0});save();if(run.set<e.sets){run.set++;run.rep=0;startRest(e.rest)}else if(run.i<run.ids.length-1){run.i++;run.set=1;run.rep=0;startRest(e.rest)}else finishWorkout()}
function startRest(sec){run.resting=true;let left=sec;$('#overlay').innerHTML=`<div class="restOverlay"><div class="restBox"><small>DESCANSO AUTOMÁTICO</small><h2>Recupera y prepárate</h2><div class="restRing" id="restnum">${fmt(left)}</div><div class="restActions"><button onclick="addRest(15)">+15 s</button><button onclick="skipRest()">Saltar descanso</button></div></div></div>`;clearInterval(restTimer);restTimer=setInterval(()=>{left--;const x=$('#restnum');if(x)x.textContent=fmt(left);if(left<=0){clearInterval(restTimer);skipRest()}},1000);window._rest={get:()=>left,set:v=>left=v}}
function addRest(s){if(window._rest)window._rest.set(window._rest.get()+s)}function skipRest(){clearInterval(restTimer);$('#overlay').innerHTML='';if(!run)return;run.resting=false;renderWorkout();startCounter()}
function finishWorkout(){clearInterval(timer);localStorage.removeItem('dmfit_active');const elapsed=Math.round((Date.now()-run.started)/60000);S.logs.push({date:new Date().toISOString(),kind:run.kind,session:true,minutes:elapsed});save();run=null;render(`${head('Entrenamiento completado','','home()')}<div class="page" style="text-align:center;padding-top:50px"><div style="width:100px;height:100px;border-radius:50%;background:#0c3851;border:3px solid var(--blue);display:grid;place-items:center;margin:auto;font-size:45px">✓</div><h1>¡Sesión completada!</h1><p style="color:#a8bbc5">Buen trabajo. El entrenamiento ha quedado guardado en tu progreso.</p><button class="primary" onclick="progress()">VER PROGRESO</button></div>`,'progress',false)}
function calisthenics(){const items=[['Programa 15 minutos','Circuito guiado · 5 ejercicios'],['Tren superior','Flexiones · Dominadas · Core'],['Tren inferior','Sentadillas · Zancadas · Core'],['Full Calistenia','Todo el cuerpo · sin material']];render(`${head('CALISTENIA','FUERZA EN LIBERTAD','home()')}<div class="page"><div class="seg">${LEVELS.map((x,i)=>`<button class="${i===S.level?'on':''}" onclick="S.level=${i};save();calisthenics()">${x}</button>`).join('')}</div>${items.map((x,i)=>{const e=CALI[i%CALI.length];return `<div class="plan" onclick="startCali(${i})"><div class="planArt">${poseSVG(e.kind,1)}</div><div><b>${x[0]}</b><small>${x[1]}</small><small class="meta">Conteo automático · Movimiento guiado</small></div><div class="arr">›</div></div>`}).join('')}</div>`,'more')}
function startCali(i){const sets=i===0?['squat','pushup','lunge','mountain','plank']:i===1?['pushup','pullup','plank']:i===2?['squat','lunge','mountain']:['squat','pushup','lunge','mountain','plank'];startWorkout(sets,'cali')}
function cardio(){const names=['Cinta de correr','Bicicleta estática','Elíptica','Remo','HIIT 20 min'];render(`${head('Cardio','MEJORA TU RESISTENCIA','more()')}<div class="page">${names.map((n,i)=>`<div class="moreCard" onclick="toast('Sesión ${n} preparada')"><div class="ico">${icon('heart')}</div><div><b>${n}</b><small>${20+i*5} min · sesión guiada</small></div><div class="arr">›</div></div>`).join('')}</div>`,'more')}
function progress(){const sessions=S.logs.filter(x=>x.session).length,mins=S.logs.filter(x=>x.session).reduce((a,x)=>a+(x.minutes||0),0),vol=Math.round(S.logs.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0));render(`${head('Progreso','TU EVOLUCIÓN','home()')}<div class="page"><div class="seg"><button class="on">Resumen</button><button>Estadísticas</button><button>Historial</button></div><div class="stats"><div class="stat"><small>Entrenamientos</small><b>${sessions}</b><em>actividad registrada</em></div><div class="stat"><small>Tiempo total</small><b>${Math.floor(mins/60)}h ${mins%60}m</b><em>constancia</em></div><div class="stat"><small>Volumen total</small><b>${vol.toLocaleString('es-ES')} kg</b><em>progreso</em></div><div class="stat"><small>kcal estimadas</small><b>${Math.round(mins*7.5)}</b><em>estimación</em></div></div><div class="chart"><b>Evolución de fuerza</b><svg viewBox="0 0 330 160"><path d="M15 135H315M15 100H315M15 65H315M15 30H315" stroke="#183747"/><polyline points="15,125 65,116 115,103 165,96 215,80 265,67 315,45" fill="none" stroke="#0aa4ff" stroke-width="4"/><g fill="#0aa4ff">${[[15,125],[65,116],[115,103],[165,96],[215,80],[265,67],[315,45]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}</g></svg></div><div class="moreCard"><div class="ico">${icon('chart')}</div><div><b>Logros</b><small>${Math.max(1,sessions)} objetivos completados</small></div><div class="arr">›</div></div></div>`,'progress')}
function more(){render(`${head('Más','TODO EN UN MISMO ESTILO','home()')}<div class="page">${moreCard('bolt','Calistenia','Programa y entrenamientos','calisthenics()')}${moreCard('heart','Cardio','Sesiones guiadas','cardio()')}${moreCard('calendar','Calendario','Planifica tu disciplina','calendarPage()')}${moreCard('user','Perfil','Tu actividad y datos','profile()')}${moreCard('gear','Ajustes','Ritmo y preferencias','settings()')}</div>`,'more')}
function moreCard(ic,t,s,fn){return `<div class="moreCard" onclick="${fn}"><div class="ico">${icon(ic)}</div><div><b>${t}</b><small>${s}</small></div><div class="arr">›</div></div>`}
function calendarPage(){const d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();render(`${head('Calendario','PLANIFICA TU DISCIPLINA','more()')}<div class="page"><div class="sectionTitle"><h1>${d.toLocaleDateString('es',{month:'long',year:'numeric'})}</h1></div><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div style="text-align:center;font-size:8px;color:#8fa8b6">${x}</div>`).join('')}${Array.from({length:days},(_,i)=>`<div class="day ${S.logs.some(x=>new Date(x.date).getDate()===i+1)?'done':''}">${i+1}</div>`).join('')}</div></div>`,'more')}

function cad(d){S.cadence=Math.max(1.5,Math.min(6,Math.round((S.cadence+d)*2)/2));save();settings()}function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dm-fitness-datos.json';a.click()}

const p={};for(const k in q)p[k]=P(q[k][0],q[k][1]);const skin='#d8a07b',skin2='#c98664',shirt='#17374a',shirt2='#0b2432',shorts='#111a22',shoe='#1a2229',outline='#18232a',blue='#17a9ff';const limb=(a,b,w=12,col=skin)=>`<path d="M${p[a][0]} ${p[a][1]}L${p[b][0]} ${p[b][1]}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;const joint=(k,r=4)=>`<circle cx="${p[k][0]}" cy="${p[k][1]}" r="${r}" fill="${skin2}" opacity=".55"/>`;const dumb=(k)=>`<g transform="translate(${p[k][0]} ${p[k][1]})"><rect x="-8" y="-2" width="16" height="4" rx="2" fill="#313b42"/><rect x="-13" y="-6" width="5" height="12" rx="2" fill="#151b1f"/><rect x="8" y="-6" width="5" height="12" rx="2" fill="#151b1f"/></g>`;let eq='';if(['curl','lateral','shoulder','lunge','hinge','press','incline','fly','squat','triceps'].includes(kind))eq=dumb('lh')+dumb('rh');if(['pulldown','pullup'].includes(kind))eq=`<path d="M34 22H126" stroke="#3a4850" stroke-width="6" stroke-linecap="round"/>`;if(kind==='row')eq=`<path d="M113 80H151" stroke="#647782" stroke-width="5"/><rect x="25" y="122" width="100" height="7" rx="3" fill="#647782"/>`;if(['legpress','legext','legcurl','hipthrust'].includes(kind))eq=`<rect x="18" y="25" width="125" height="111" rx="14" fill="none" stroke="#8a9ba4" stroke-width="5" opacity=".75"/>`;

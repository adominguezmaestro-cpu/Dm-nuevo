<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bingo - 5 cartones</title>
<style>
  :root{
    --bg:#f5f1e8;
    --card:#fffaf0;
    --ink:#202020;
    --muted:#777;
    --mark:#d8d8d8;
    --line:#2f7d32;
    --bingo:#b71c1c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
    background:var(--bg);
    color:var(--ink);
    padding:16px 12px 40px;
  }
  h1{font-size:24px;margin:0 0 6px;text-align:center}
  .sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:14px}
  .toolbar{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px;
  }
  button{
    font:inherit; border:1px solid #aaa; background:white; border-radius:10px;
    padding:10px 14px; font-weight:700;
  }
  .card{
    background:var(--card);
    border:2px solid #222;
    border-radius:14px;
    margin:14px auto;
    max-width:760px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .card-title{
    font-weight:900; font-size:20px; margin:0 0 10px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .status{font-size:13px;color:var(--muted)}
  .row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin:8px 0;
  }
  .num{
    min-height:56px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #333;
    border-radius:10px;
    background:white;
    font-size:24px;
    font-weight:900;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    position:relative;
  }
  .num.marked{
    background:var(--mark);
    color:#555;
    text-decoration:line-through;
  }
  .num.marked::after{
    content:"✕";
    position:absolute;
    font-size:38px;
    color:#111;
    opacity:.55;
  }
  .row.line-done .num{
    outline:3px solid var(--line);
  }
  .card.bingo{
    outline:5px solid var(--bingo);
  }
  .big-alert{
    max-width:760px;margin:0 auto 14px;padding:10px 12px;
    border-radius:12px;background:white;border:2px solid #222;
    font-weight:900;text-align:center;display:none;
  }
  @media (max-width:520px){
    .num{font-size:21px;min-height:52px}
    .card{padding:10px}
    .row{gap:6px}
  }
</style>
</head>
<body>
  <h1>🎱 BINGO — MIS 5 CARTONES</h1>
  <div class="sub">Toca un número para tacharlo. Vuelve a tocarlo para desmarcarlo.</div>

  <div class="toolbar">
    <button onclick="resetAll()">Reiniciar todo</button>
  </div>

  <div id="alert" class="big-alert"></div>
  <main id="cards"></main>

<script>
const cards = [
  {id:"1018", rows:[
    [14,30,43,64,80],
    [18,23,49,52,75],
    [6,27,58,79,85]
  ]},
  {id:"1019", rows:[
    [4,25,34,61,71],
    [10,29,45,50,77],
    [8,36,57,66,90]
  ]},
  {id:"1020", rows:[
    [16,32,41,62,84],
    [2,21,47,55,73],
    [5,38,59,68,89]
  ]},
  {id:"1021", rows:[
    [7,26,45,64,74],
    [9,27,30,53,80],
    [19,48,59,79,85]
  ]},
  {id:"1022", rows:[
    [11,35,41,63,71],
    [5,25,39,51,68],
    [18,49,55,73,81]
  ]}
];

let marked = JSON.parse(localStorage.getItem("bingoMarked") || "{}");

function key(cardId, r, n){ return `${cardId}-${r}-${n}`; }

function render(){
  const main = document.getElementById("cards");
  main.innerHTML = "";
  cards.forEach(card=>{
    const box = document.createElement("section");
    box.className = "card";
    box.dataset.id = card.id;

    const title = document.createElement("div");
    title.className = "card-title";
    title.innerHTML = `<span>Cartón ${card.id}</span><span class="status" id="status-${card.id}"></span>`;
    box.appendChild(title);

    card.rows.forEach((row, r)=>{
      const rowEl = document.createElement("div");
      rowEl.className = "row";
      rowEl.dataset.row = r;
      row.forEach(n=>{
        const d = document.createElement("div");
        d.className = "num";
        if(marked[key(card.id,r,n)]) d.classList.add("marked");
        d.textContent = n;
        d.onclick = ()=>toggle(card.id,r,n);
        rowEl.appendChild(d);
      });
      box.appendChild(rowEl);
    });
    main.appendChild(box);
  });
  updateStatus();
}

function toggle(cardId,r,n){
  const k = key(cardId,r,n);
  marked[k] = !marked[k];
  if(!marked[k]) delete marked[k];
  localStorage.setItem("bingoMarked", JSON.stringify(marked));
  render();
}

function updateStatus(){
  let message = "";
  cards.forEach(card=>{
    let total = 0;
    let anyLine = false;
    const box = document.querySelector(`.card[data-id="${card.id}"]`);
    card.rows.forEach((row,r)=>{
      const count = row.filter(n=>marked[key(card.id,r,n)]).length;
      total += count;
      const rowEl = box.querySelector(`.row[data-row="${r}"]`);
      if(count === 5){ rowEl.classList.add("line-done"); anyLine = true; }
    });
    const st = document.getElementById(`status-${card.id}`);
    st.textContent = `${total}/15`;
    if(total === 15){
      box.classList.add("bingo");
      message = `🚨 ¡BINGO! Cartón ${card.id}`;
    } else if(anyLine && !message){
      message = `✅ ¡LÍNEA! Cartón ${card.id}`;
    }
  });
  const alert = document.getElementById("alert");
  if(message){
    alert.style.display = "block";
    alert.textContent = message;
  }else{
    alert.style.display = "none";
    alert.textContent = "";
  }
}

function resetAll(){
  if(confirm("¿Quieres borrar todas las marcas?")){
    marked = {};
    localStorage.removeItem("bingoMarked");
    render();
  }
}
render();
</script>
</body>
</html>

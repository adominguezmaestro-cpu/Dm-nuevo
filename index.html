function setNav(id){['Home','Cal','Prog','Profile'].forEach(x=>$('#nav'+x).classList.remove('on'));if(id)$('#nav'+id).classList.add('on')}
function render(html,title='DM FITNESS',push=true){if(push&&current)stack.push(current);current={html,title};document.body.classList.toggle('mockMode',html.includes('mockPage'));document.body.classList.toggle('mockHomeMode',html.includes('mockHomePage'));view().innerHTML=html;$('#topTitle').textContent=title;$('#back').style.visibility=stack.length?'visible':'hidden';scrollTo(0,0)}
function goBack(){if(!stack.length)return home(false);const p=stack.pop();current=p;view().innerHTML=p.html;$('#topTitle').textContent=p.title;$('#back').style.visibility=stack.length?'visible':'hidden';scrollTo(0,0)}
function moduleCard(c,icon,title,sub,fn){return `<div class="module" style="--c:${c}" onclick="${fn}"><div class="ico">${icon}</div><div><b>${title}</b><small>${sub}</small></div><div class="arrow">›</div></div>`}
function home(push=false){stack=[];setNav('Home');const h=`<div class="hero"><div class="logo">D<span class="m">M</span></div><h2>FITNESS</h2><div class="eyebrow">DISCIPLINA EN CADA ETAPA</div></div><div class="sectionHead"><div class="kicker">TU ENTRENAMIENTO</div><h2>Elige cómo entrenas hoy</h2><p>Un solo lugar para gimnasio, calistenia, cardio, rutinas y progreso.</p></div>${moduleCard('var(--blue)','◫','DM CALISTENIA','Sin equipamiento · 15 min · niveles','caliHome()')}${moduleCard('var(--red)','▮▬▮','DM GYM LIFE FITNESS','Catálogo profesional · máquinas · cargas',"catalog('life')")}${moduleCard('var(--yellow)','▥','DM GYM TECHNOGYM','Catálogo profesional · máquinas · cargas',"catalog('tech')")}${moduleCard('var(--green)','◒','DM CARDIO','Cinta · elíptica · bicicleta · clases guiadas','cardioHome()')}${moduleCard('var(--purple)','✦','DM RUTINAS','45 planes · diario · semanal · mensual','routinesHome()')}${moduleCard('#d4dde2','◉','DM USUARIO','Tu progreso, historial, retos y ajustes','profile()')}<div class="footerNote">ENTRENA · PROGRESA · DISFRUTA</div>`;render(h,'DM FITNESS',false)}

function routinesHome(){setNav(null);render(`<div class="sectionHead" style="--accent:var(--purple)"><div class="kicker">DM RUTINAS</div><h2>Elige tu nivel</h2><p>45 planes reales: 15 por nivel. Después eliges Diario, Semanal o Mensual.</p></div>${Object.entries(LEVELS).map(([k,l])=>`<div class="level" style="--c:${l.c}" onclick="chooseLevel('${k}')"><div class="badge">${l.icon}</div><div><b>${l.name}</b><small>${l.sub}</small><small>5 diarios · 5 semanales · 5 mensuales</small></div><div class="arrow">›</div></div>`).join('')}<div class="notice">La marca del gimnasio no se elige aquí. Primero eliges tu plan. <b>Life Fitness o Technogym se selecciona una sola vez al iniciar la sesión.</b></div>`,'DM RUTINAS')}
function chooseLevel(k){selectedLevel=k;const l=LEVELS[k];render(`<div class="sectionHead" style="--accent:${l.c}"><div class="kicker">${l.name}</div><h2>¿Qué tipo de planificación necesitas?</h2><p>Cada modalidad contiene 5 planes diferentes.</p></div>${Object.entries(TYPES).map(([k,v])=>`<div class="level" style="--c:${l.c}" onclick="chooseType('${k}')"><div class="badge">${v[0]}</div><div><b>${v[1]}</b><small>${v[2]}</small><small>5 planes diferentes</small></div><div class="arrow">›</div></div>`).join('')}`,'DM Rutinas · '+l.name)}
function chooseType(k){selectedType=k;const l=LEVELS[selectedLevel],t=TYPES[k];render(`<div class="sectionHead" style="--accent:${l.c}"><div class="kicker">${l.name} · ${t[1]}</div><h2>Elige uno de los 5 planes</h2><p>${t[2]}</p></div>${PLANS[selectedLevel][k].map((p,i)=>`<div class="plan" style="--accent:${l.c}" onclick="planDetail(${i})"><div class="num">${i+1}</div><h3>${p}</h3><p>${planDesc(k,i)}</p><div class="meta"><span class="pill">${k==='diario'?'1 sesión':k==='semanal'?(i%2?'4 días':'3 días'):'4 semanas'}</span><span class="pill">${levelTime(selectedLevel,k)} min</span></div></div>`).join('')}`,'DM Rutinas · '+t[1])}
function planDesc(type,i){if(type==='diario')return 'Entrenamiento completo en una sola visita, con orden y volumen adaptados al nivel.';if(type==='semanal')return 'Distribución de grupos musculares entre varios días para entrenar con más detalle.';return 'Programa de cuatro semanas con progresión gradual y seguimiento de cargas.'}
function levelTime(l,t){return t==='diario'?(l==='principiante'?'45–55':l==='intermedio'?'55–70':'65–80'):(l==='principiante'?'45–60':l==='intermedio'?'55–70':'60–80')}
function planDetail(i){selectedPlan=i;const name=PLANS[selectedLevel][selectedType][i],l=LEVELS[selectedLevel];const sessions=makePlan(selectedLevel,selectedType,i,'life');render(`<div class="sectionHead" style="--accent:${l.c}"><div class="kicker">${LEVELS[selectedLevel].name} · ${TYPES[selectedType][1]}</div><h2>${name}</h2><p>${planDesc(selectedType,i)}</p></div><div class="stats"><div class="stat"><small>PLAN</small><b>${i+1}/5</b></div><div class="stat"><small>DURACIÓN</small><b>${selectedType==='mensual'?'4 sem':'1 sem'}</b></div><div class="stat"><small>NIVEL</small><b>${LEVELS[selectedLevel].name}</b></div></div>${renderSessions(sessions,false)}<button class="cta" style="--accent:var(--purple)" onclick="chooseGym()">INICIAR ENTRENAMIENTO →</button><div class="notice">La elección de gimnasio aparece <b>solo al iniciar</b>. Durante los ejercicios no volverá a preguntarse.</div>`,'DM Rutinas · Plan')}
function chooseGym(){render(`<div class="sectionHead" style="--accent:var(--purple)"><div class="kicker">ANTES DE EMPEZAR</div><h2>¿En qué gimnasio entrenas hoy?</h2><p>Esta selección se aplicará a toda la sesión.</p></div><div class="brandSelect" style="--c:var(--red)"><div class="brandLogo">LIFE FITNESS</div><p>La rutina cargará automáticamente las máquinas Life Fitness correspondientes. Tus pesos e historial se guardan por separado.</p><button onclick="startPlan('life')">ENTRENAR CON LIFE FITNESS</button></div><div class="brandSelect" style="--c:var(--yellow);--txt:#141414"><div class="brandLogo">TECHNOGYM</div><p>La misma rutina utilizará las máquinas Technogym equivalentes. No se mezclan las cargas con Life Fitness.</p><button onclick="startPlan('tech')">ENTRENAR CON TECHNOGYM</button></div>`,'Elegir gimnasio')}
const MAP={chest:['life_chest','tech_chest'],lat:['life_lat','tech_lat'],row:['life_row','tech_lat'],shoulder:['life_shoulder','tech_shoulder'],leg:['life_legext','tech_leg'],legext:['life_legext','tech_legext'],legcurl:['life_legcurl','tech_legcurl']};
function machineBy(key,b){const id=MAP[key][b==='life'?0:1];return DB[b].find(x=>x.id===id)||DB[b][0]}
const DAYSETS=[['chest','lat','leg','shoulder','row','legcurl'],['chest','shoulder','lat','row'],['leg','legext','legcurl','row'],['lat','row','chest','shoulder'],['leg','chest','lat','legcurl','shoulder']];
function makePlan(level,type,idx,b){let days;if(type==='diario')days=[DAYSETS[idx%DAYSETS.length]];else if(type==='semanal')days=idx%2?[['chest','shoulder','lat'],['leg','legext','legcurl'],['row','lat','chest'],['leg','shoulder','row']]:[['chest','lat','row'],['leg','legext','legcurl'],['shoulder','chest','lat']];else days=[['chest','lat','row'],['leg','legext','legcurl'],['shoulder','chest','lat'],['leg','row','legcurl']];return days.map((keys,di)=>({name:type==='diario'?'Sesión completa':`Día ${di+1}`,items:keys.map(k=>machineBy(k,b))}))}
function renderSessions(sessions,clickable=true){return sessions.map((s,si)=>`<div class="session"><div class="shead"><b>${s.name}</b><div class="tiny muted">${s.items.length} ejercicios</div></div>${s.items.map((m,mi)=>`<div class="exerciseRow" ${clickable?`onclick="exerciseDetail('${m.id}')"`:''}><img src="${m.img}"><div><b>${mi+1}. ${m.name}</b><small>${m.sets} series · ${m.reps} · ${m.muscles.slice(0,2).join(' + ')}</small></div><div class="arrow">›</div></div>`).join('')}</div>`).join('')}
function startPlan(b){brand=b;workoutIndex=0;state.active={level:selectedLevel,type:selectedType,plan:selectedPlan,brand:b,started:Date.now()};save();workoutList()}
function workoutList(){const sessions=makePlan(selectedLevel,selectedType,selectedPlan,brand);const color=brand==='life'?'var(--red)':'var(--yellow)';render(`<div class="sectionHead" style="--accent:${color}"><div class="kicker">ENTRENAMIENTO EN CURSO · ${brand==='life'?'LIFE FITNESS':'TECHNOGYM'}</div><h2>${PLANS[selectedLevel][selectedType][selectedPlan]}</h2><p>La marca ya está elegida para toda la sesión.</p></div>${renderSessions(sessions,true)}<button class="cta" style="--accent:${color};--cta:${brand==='tech'?'#111':'#fff'}" onclick="finishWorkout()">FINALIZAR ENTRENAMIENTO</button>`,'Entrenamiento')}
function allMachines(){return [...DB.life,...DB.tech,...DB.cardio]}
function exerciseDetail(id){const m=allMachines().find(x=>x.id===id);if(!m)return;const b=m.id.startsWith('life')?'life':m.id.startsWith('tech')?'tech':'cardio';const c=b==='life'?'var(--red)':b==='tech'?'var(--yellow)':'var(--green)';const a=anatomyFor(m,b);const last=state.weights[id]||'';render(`<div class="sectionHead" style="--accent:${c}"><div class="kicker">${m.brand}${m.model?' · '+m.model:''}</div><h2>${m.name}</h2><p>${m.muscles.join(' · ')}</p></div><div class="machine machineWide" style="--accent:${c}"><div class="visual machineHero"><img src="${m.detail||m.img}" alt="${m.name}"></div></div><div class="muscleList" style="--accent:${c}">${m.muscles.map(x=>`<span class="muscle">${x}</span>`).join('')}</div><div class="stats"><div class="stat"><small>SERIES</small><b>${m.sets}</b></div><div class="stat"><small>REPS</small><b>${m.reps}</b></div><div class="stat"><small>ÚLTIMO PESO</small><b>${last?last+' kg':'—'}</b></div></div><div class="card"><b>Técnica</b>${(m.steps||[]).map((x,i)=>`<div class="step" style="--accent:${c}"><div class="sn">${i+1}</div><div>${x}</div></div>`).join('')}</div>${b!=='cardio'?`<div class="card"><b>Registrar carga</b><div class="weightBox"><button onclick="stepWeight(-2.5)">−</button><input id="kg" inputmode="decimal" value="${last||''}" placeholder="kg"><button onclick="stepWeight(2.5)">+</button></div><label class="tiny muted">RPE / esfuerzo (1–10)</label><input class="search" id="rpe" inputmode="numeric" placeholder="Ej. 8"><button class="cta" style="--accent:${c};--cta:${b==='tech'?'#111':'#fff'}" onclick="saveSet('${id}')">COMPLETAR SERIE</button></div>`:''}`,'Ficha de máquina')}
function anatomyFor(m,b){const keys=Object.keys(DB.anatomy[b]||{});if(!keys.length)return '';const z=(m.zones||[]).join('|');return DB.anatomy[b][z]||DB.anatomy[b][keys.find(k=>m.muscles.some(x=>k.includes(normalizeMuscle(x))))]||DB.anatomy[b][keys[0]]}
function normalizeMuscle(x){x=x.toLowerCase();if(x.includes('pect'))return 'chest';if(x.includes('dors'))return 'lats';if(x.includes('tríc'))return 'triceps';if(x.includes('bí'))return 'biceps';if(x.includes('cuád'))return 'quads';if(x.includes('isqu'))return 'hamstrings';if(x.includes('glút'))return 'glutes';if(x.includes('gem'))return 'calves';return x}
function stepWeight(d){const e=$('#kg');e.value=Math.max(0,(parseFloat(e.value)||0)+d)}
function saveSet(id){const kg=parseFloat($('#kg').value)||0,rpe=parseFloat($('#rpe').value)||null;state.weights[id]=kg;state.history.push({id,kg,rpe,date:new Date().toISOString(),brand});save();alert('Serie guardada');goBack()}
function finishWorkout(){state.logs.push({date:new Date().toISOString(),kind:'gym',brand,level:selectedLevel,type:selectedType,plan:selectedPlan});state.active=null;save();render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">ENTRENAMIENTO COMPLETADO</div><h2>Sesión terminada ✓</h2><p>Se ha guardado en tu historial y progreso.</p></div><div class="stats"><div class="stat"><small>PLAN</small><b>${selectedPlan+1}/5</b></div><div class="stat"><small>MARCA</small><b>${brand==='life'?'Life':'Tech'}</b></div><div class="stat"><small>NIVEL</small><b>${LEVELS[selectedLevel].name}</b></div></div><button class="cta" style="--accent:var(--green)" onclick="home()">VOLVER AL INICIO</button>`,'Completado')}
function catalog(b){setNav(null);const arr=DB[b],c=b==='life'?'var(--red)':'var(--yellow)',title=b==='life'?'DM GYM LIFE FITNESS':'DM GYM TECHNOGYM';render(`<div class="sectionHead" style="--accent:${c}"><div class="kicker">CATÁLOGO PROFESIONAL</div><h2>${title}</h2><p>Máquina por máquina. Imagen completa, músculos, técnica y carga independiente.</p></div><input class="search" id="q" placeholder="Buscar máquina o músculo…" oninput="filterCatalog('${b}')"><div id="catList">${machineCards(arr)}</div>` ,title)}
function machineCards(arr){return arr.map(m=>`<div class="machineCard" onclick="exerciseDetail('${m.id}')"><img src="${m.img}" alt="${m.name}"><div><b>${m.name}</b><small>${m.brand}${m.model?' · '+m.model:''}</small><small>${m.muscles.join(' · ')}</small></div><div class="arrow">›</div></div>`).join('')}
function filterCatalog(b){const q=$('#q').value.toLowerCase();$('#catList').innerHTML=machineCards(DB[b].filter(m=>(m.name+' '+m.muscles.join(' ')).toLowerCase().includes(q)))}
function cardioHome(){setNav(null);render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">DM CARDIO</div><h2>Resistencia · salud · resultados</h2><p>Máquinas y clases guiadas de 20, 30 y 40 minutos.</p></div><div class="grid2"><div class="tile accent" style="--accent:var(--green)" onclick="cardioCatalog()"><div class="ticon">◒</div><b>Máquinas</b><small>Cinta, bicicleta, elíptica, escaladora y remo</small></div><div class="tile accent" style="--accent:var(--green)" onclick="cardioClasses()"><div class="ticon">▶</div><b>Clases guiadas</b><small>Suave · moderada · intensa · intervalos</small></div></div>`,'DM CARDIO')}
function cardioCatalog(){render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">CARDIO</div><h2>Máquinas</h2></div>${machineCards(DB.cardio)}`,'Máquinas cardio')}
function cardioClasses(){render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">CLASES GUIADAS</div><h2>Elige tu sesión</h2></div>${[['20 min','Suave','Base aeróbica'],['30 min','Moderada','Resistencia'],['40 min','Intensa','Rendimiento'],['30 min','Intervalos','HIIT']].map((x,i)=>`<div class="plan" style="--accent:var(--green)" onclick="startCardio(${parseInt(x[0])},'${x[1]}')"><div class="num">${i+1}</div><h3>${x[0]} · ${x[1]}</h3><p>${x[2]} · calentamiento, fase principal, recuperación y vuelta a la calma.</p></div>`).join('')}`,'Clases cardio')}
function startCardio(min,intensity){let sec=min*60;render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">CLASE EN CURSO</div><h2>${min} min · ${intensity}</h2><p id="phase">Calentamiento · ritmo cómodo</p></div><div class="card" style="text-align:center"><div id="timer" style="font-size:56px;font-weight:1000">${min}:00</div><div class="muted small">Tiempo restante</div><div class="progressbar" style="--accent:var(--green)"><i id="bar" style="width:0"></i></div></div><button class="cta" style="--accent:var(--green)" onclick="finishCardio(${min},'${intensity}')">FINALIZAR CLASE</button>`,'Cardio en curso');const total=sec;window._card=setInterval(()=>{sec--;const m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');const t=$('#timer');if(!t)return clearInterval(window._card);t.textContent=m+':'+s;$('#bar').style.width=((total-sec)/total*100)+'%';const pct=(total-sec)/total;$('#phase').textContent=pct<.15?'Calentamiento · ritmo cómodo':pct<.55?'Ritmo medio · mantén cadencia':pct<.8?'Bloque principal · aumenta resistencia':'Vuelta a la calma';if(sec<=0)finishCardio(min,intensity)},1000)}
function finishCardio(min,intensity){if(window._card)clearInterval(window._card);state.logs.push({date:new Date().toISOString(),kind:'cardio',minutes:min,intensity});save();render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">CARDIO COMPLETADO</div><h2>${min} minutos ✓</h2><p>Sesión guardada en tu progreso.</p></div><button class="cta" style="--accent:var(--green)" onclick="home()">VOLVER AL INICIO</button>`,'Completado')}
function caliHome(){setNav(null);render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">DM CALISTENIA</div><h2>Fuerza · control · libertad</h2><p>Programa de 15 minutos sin equipamiento y rutinas por nivel.</p></div>${Object.entries(LEVELS).map(([k,l])=>`<div class="level" style="--c:var(--blue)" onclick="caliPlan('${k}')"><div class="badge">${l.icon}</div><div><b>${l.name}</b><small>15 min · sin equipamiento · 4 semanas</small></div><div class="arrow">›</div></div>`).join('')}`,'DM CALISTENIA')}
const CALI={principiante:['Sentadillas · 10','Flexiones con rodillas · 6–8','Zancadas alternas · 8 total','Mountain climbers lentos · 20 s','Plancha · 20 s'],intermedio:['Sentadillas · 15','Flexiones normales · 10','Zancadas · 12 total','Mountain climbers · 30 s','Plancha con toques · 24'],avanzado:['Pike push-ups · 10','Flexiones explosivas · 10','Pistol squat parcial · 6/pierna','Burpees · 10','Hollow hold · 30 s']};
function caliPlan(l){render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">${LEVELS[l].name}</div><h2>15 minutos · EMOM</h2><p>5 ejercicios × 3 vueltas · sin equipamiento.</p></div><div class="session"><div class="shead"><b>Semanas 1–2</b></div>${CALI[l].map((x,i)=>`<div class="exerciseRow"><div style="width:45px;height:45px;border:1px solid var(--blue);border-radius:10px;display:grid;place-items:center;color:var(--blue);font-weight:1000">${i+1}</div><div><b>${x}</b><small>1 minuto de trabajo/descanso</small></div></div>`).join('')}</div><button class="cta" style="--accent:var(--blue)" onclick="startCali('${l}')">INICIAR 15 MIN</button>`,'Calistenia · '+LEVELS[l].name)}
function startCali(l){let sec=15*60;render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">ENTRENAMIENTO EN CURSO</div><h2>${LEVELS[l].name} · 15 min</h2><p id="caliEx">${CALI[l][0]}</p></div><div class="card" style="text-align:center"><div id="caliTimer" style="font-size:56px;font-weight:1000">15:00</div><div class="muted small">EMOM · cambia cada minuto</div></div><button class="cta" style="--accent:var(--blue)" onclick="finishCali('${l}')">FINALIZAR</button>`,'Calistenia en curso');window._cali=setInterval(()=>{sec--;const t=$('#caliTimer');if(!t)return clearInterval(window._cali);t.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');const elapsed=15*60-sec,idx=Math.floor(elapsed/60)%5;$('#caliEx').textContent=CALI[l][idx];if(sec<=0)finishCali(l)},1000)}
function finishCali(l){if(window._cali)clearInterval(window._cali);state.logs.push({date:new Date().toISOString(),kind:'cali',minutes:15,level:l});save();render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">CALISTENIA COMPLETADA</div><h2>15 minutos ✓</h2><p>Sesión añadida a tu historial.</p></div><button class="cta" style="--accent:var(--blue)" onclick="home()">VOLVER AL INICIO</button>`,'Completado')}
function calendar(){setNav('Cal');const now=new Date(),y=now.getFullYear(),mo=now.getMonth(),first=new Date(y,mo,1).getDay()||7,last=new Date(y,mo+1,0).getDate();let cells='';for(let i=1;i<first;i++)cells+='<div></div>';for(let d=1;d<=last;d++){const marked=state.logs.some(x=>{const z=new Date(x.date);return z.getFullYear()===y&&z.getMonth()===mo&&z.getDate()===d});cells+=`<div class="day ${marked?'mark':''}">${d}${marked?'<i class="d"></i>':''}</div>`}render(`<div class="sectionHead" style="--accent:var(--purple)"><div class="kicker">CALENDARIO GENERAL</div><h2>${now.toLocaleString('es',{month:'long'})} ${y}</h2><p>Calistenia · Life Fitness · Technogym · Cardio · DM Rutinas.</p></div><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div class="tiny muted" style="text-align:center">${x}</div>`).join('')}${cells}</div>`,'Calendario',true)}
function progress(){setNav('Prog');const gym=state.logs.filter(x=>x.kind==='gym').length,card=state.logs.filter(x=>x.kind==='cardio').reduce((a,x)=>a+(x.minutes||0),0),cali=state.logs.filter(x=>x.kind==='cali').length;render(`<div class="sectionHead" style="--accent:var(--purple)"><div class="kicker">PROGRESO</div><h2>Tu actividad</h2><p>Datos calculados únicamente con los entrenamientos que registres.</p></div><div class="stats"><div class="stat"><small>GYM</small><b>${gym}</b></div><div class="stat"><small>CALISTENIA</small><b>${cali}</b></div><div class="stat"><small>CARDIO</small><b>${card} min</b></div></div><div class="card"><b>Historial de cargas</b>${Object.entries(state.weights).length?Object.entries(state.weights).slice(-8).map(([id,kg])=>{const m=allMachines().find(x=>x.id===id);return `<div class="step"><div>•</div><div>${m?m.name:id}<br><span class="muted tiny">${kg} kg</span></div></div>`}).join(''):'<p class="muted small">Todavía no hay cargas registradas.</p>'}</div>`,'Progreso',true)}
function profile(){setNav('Profile');render(`<div class="profileHero" style="--accent:var(--purple)"><div class="avatar">DM</div><h2 style="margin-bottom:3px">Mi Perfil</h2><div class="muted small">Tus datos se muestran cuando tú los introduces.</div></div><div class="grid2"><div class="tile"><div class="ticon">⌁</div><b>Mi progreso</b><small>Entrenamientos, cargas y cardio</small></div><div class="tile"><div class="ticon">▦</div><b>Historial</b><small>Sesiones realizadas</small></div><div class="tile"><div class="ticon">★</div><b>Retos y logros</b><small>Calculados con tus datos reales</small></div><div class="tile"><div class="ticon">⚙</div><b>Ajustes</b><small>Preferencias y copia de seguridad</small></div></div><div class="card"><b>Resumen</b><div class="stats"><div class="stat"><small>SESIONES</small><b>${state.logs.length}</b></div><div class="stat"><small>CARGAS</small><b>${Object.keys(state.weights).length}</b></div><div class="stat"><small>ACTIVO</small><b>${state.active?'Sí':'No'}</b></div></div></div>`,'DM USUARIO',true)}
function openSettings(){render(`<div class="sectionHead"><div class="kicker">AJUSTES</div><h2>DM FITNESS</h2><p>Datos guardados localmente en este navegador.</p></div><div class="card"><b>Copia de seguridad</b><p class="muted small">Exporta tus datos para conservar pesos, historial y entrenamientos.</p><button class="cta" onclick="exportData()">EXPORTAR DATOS</button><button class="cta" style="--accent:#5b6870" onclick="resetData()">BORRAR DATOS LOCALES</button></div>`,'Ajustes')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dm-fitness-backup.json';a.click()}
function resetData(){if(confirm('¿Seguro que quieres borrar los datos guardados?')){localStorage.removeItem('dmfitness_master');location.reload()}}

// ===== DM FITNESS PRO V4: motor guiado + Calistenia completa =====
let guideTimer=null, guidePaused=false, guideEnd=0, guideRemain=0, guideMode=null, guideCtx=null, wakeLock=null;
function beep(freq=880,dur=.09){try{if(!guideCtx)guideCtx=new (window.AudioContext||window.webkitAudioContext)();if(guideCtx.state==='suspended')guideCtx.resume();const o=guideCtx.createOscillator(),g=guideCtx.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(guideCtx.destination);o.start();o.stop(guideCtx.currentTime+dur)}catch(e){}}
async function wake(on=true){try{if(on&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function clearGuide(){if(guideTimer){clearInterval(guideTimer);guideTimer=null}}

function caliHome(){setNav(null);render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">DM CALISTENIA</div><h2>Fuerza · control · libertad</h2><p>Recuperada como módulo completo: rutinas, ejercicios, programas, historial, retos y progreso.</p></div>
<div class="menuRow" style="--accent:var(--blue)" onclick="caliLevels()"><div class="mi">${icon('body')}</div><div><b>Rutinas por nivel</b><small>Principiante · Intermedio · Avanzado</small></div><div class="arrow">›</div></div>
<div class="menuRow" style="--accent:var(--blue)" onclick="caliExercises()"><div class="mi">${icon('book')}</div><div><b>Ejercicios</b><small>Técnica · músculos · progresiones</small></div><div class="arrow">›</div></div>
<div class="menuRow" style="--accent:var(--blue)" onclick="caliPrograms()"><div class="mi">${icon('target')}</div><div><b>Programas</b><small>15 min · fuerza · resistencia · core</small></div><div class="arrow">›</div></div>
<div class="menuRow" style="--accent:var(--blue)" onclick="caliHistory()"><div class="mi">${icon('history')}</div><div><b>Mis entrenamientos</b><small>Historial y progreso real</small></div><div class="arrow">›</div></div>
<div class="menuRow" style="--accent:var(--blue)" onclick="caliChallenges()"><div class="mi">${icon('trophy')}</div><div><b>Retos Calistenia</b><small>Constancia y mejora</small></div><div class="arrow">›</div></div>`,'DM CALISTENIA')}
function caliLevels(){render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">RUTINAS POR NIVEL</div><h2>Elige tu nivel</h2><p>Programa original de 15 minutos, sin equipamiento y 4 semanas.</p></div>${Object.entries(LEVELS).map(([k,l])=>`<div class="level" style="--c:var(--blue)" onclick="caliPlan('${k}')"><div class="badge">${l.icon}</div><div><b>${l.name}</b><small>Semanas 1–2 + progresión semanas 3–4</small></div><div class="arrow">›</div></div>`).join('')}`,'Calistenia · Niveles')}
function caliPlan(l){const block=(title,arr)=>`<div class="session"><div class="shead"><b>${title}</b><div class="tiny muted">5 ejercicios × 3 vueltas</div></div>${arr.map((x,i)=>`<div class="exerciseRow"><div style="width:45px;height:45px;border:1px solid var(--blue);border-radius:10px;display:grid;place-items:center;color:var(--blue);font-weight:1000">${i+1}</div><div><b>${x.n}</b><small>${x.reps?x.reps+' repeticiones':x.sec+' segundos'} · ${x.m.join(' + ')}</small></div></div>`).join('')}</div>`;render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">${LEVELS[l].name}</div><h2>Programa 15 min · 4 semanas</h2><p>EMOM: cada minuto incluye trabajo + el descanso restante.</p></div>${block('Semanas 1–2',CALI2[l].w12)}${block('Semanas 3–4',CALI2[l].w34)}<button class="cta" style="--accent:var(--blue)" onclick="caliChooseWeek('${l}')">INICIAR ENTRENAMIENTO</button>`,'Calistenia · '+LEVELS[l].name)}
function caliChooseWeek(l){render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">ANTES DE EMPEZAR</div><h2>¿Qué bloque entrenas?</h2></div><div class="grid2"><div class="tile accent" style="--accent:var(--blue)" onclick="startCaliPro('${l}','w12')"><b>Semanas 1–2</b><small>Base y adaptación</small></div><div class="tile accent" style="--accent:var(--blue)" onclick="startCaliPro('${l}','w34')"><b>Semanas 3–4</b><small>Progresión</small></div></div>`,'Calistenia')}
let caliRun=null;
function startCaliPro(l,w){clearGuide();caliRun={l,w,arr:CALI2[l][w],idx:0,round:1,repDone:0,minuteLeft:60,workLeft:null,paused:false,started:Date.now()};state.active={kind:'cali',l,w,idx:0,round:1,started:Date.now()};save();countdown(()=>{wake(true);renderCaliRun();startCaliTick()})}
function countdown(cb){let n=3;render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">PREPÁRATE</div><h2>Entrenamiento a punto de empezar</h2></div><div id="cd" class="countdown" style="--accent:var(--blue)">3</div><div class="muted" style="text-align:center">Respira · concéntrate · empieza con control</div>`,'Cuenta atrás');beep(650);const t=setInterval(()=>{n--;if(n>0){$('#cd').textContent=n;beep(650)}else{clearInterval(t);beep(1000,.16);cb()}},1000)}
function renderCaliRun(){const x=caliRun.arr[caliRun.idx],total=(caliRun.round-1)*5+caliRun.idx+1;render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">VUELTA ${caliRun.round}/3 · EJERCICIO ${caliRun.idx+1}/5</div><h2>${x.n}</h2><p>${x.m.join(' · ')}</p></div><div class="stats"><div class="stat"><small>PROGRESO</small><b>${total}/15</b></div><div class="stat"><small>MINUTO</small><b id="caliMinute">60 s</b></div><div class="stat"><small>ESTADO</small><b id="caliState">Activo</b></div></div>${x.reps?`<div class="card"><div class="bigCounter"><span id="repDone">${caliRun.repDone}</span> / ${x.reps}</div><div class="remain" id="repRemain">Quedan ${Math.max(0,x.reps-caliRun.repDone)} repeticiones</div><div class="weightBox"><button onclick="caliRep(-1)">−</button><div style="text-align:center;font-weight:900">REPETICIONES</div><button onclick="caliRep(1)">+</button></div></div>`:`<div class="roundTimer" id="workRing" style="--accent:var(--blue);--pct:0%"><div><b id="workTime">${x.sec}</b><span>segundos de trabajo</span></div></div>`}<div class="controls" style="--accent:var(--blue)"><button class="controlBtn primary" id="caliPlay" onclick="toggleCali()">${icon('pause')} PAUSA</button><button class="controlBtn" onclick="completeCaliExercise()">✓ COMPLETAR</button></div><div class="notice"><b>Siguiente:</b> ${nextCaliName()}<br>Al completar, el tiempo restante del minuto se convierte en descanso.</div>`,'Calistenia en curso')}
function nextCaliName(){let i=caliRun.idx+1,r=caliRun.round;if(i>=5){i=0;r++}return r>3?'Fin del entrenamiento':caliRun.arr[i].n}
function startCaliTick(){clearGuide();const x=caliRun.arr[caliRun.idx];if(!x.reps&&caliRun.workLeft==null)caliRun.workLeft=x.sec;guideTimer=setInterval(()=>{if(!caliRun||caliRun.paused)return;caliRun.minuteLeft--;if(!x.reps&&caliRun.workLeft>0)caliRun.workLeft--;const mt=$('#caliMinute');if(mt)mt.textContent=caliRun.minuteLeft+' s';if(!x.reps){const wt=$('#workTime');if(wt)wt.textContent=Math.max(0,caliRun.workLeft);const ring=$('#workRing');if(ring)ring.style.setProperty('--pct',((x.sec-caliRun.workLeft)/x.sec*100)+'%');if(caliRun.workLeft===0)beep(950,.14)}if(caliRun.minuteLeft<=0)completeCaliExercise(true)},1000)}
function caliRep(d){if(!caliRun)return;const x=caliRun.arr[caliRun.idx];caliRun.repDone=Math.max(0,Math.min(x.reps,caliRun.repDone+d));$('#repDone').textContent=caliRun.repDone;$('#repRemain').textContent='Quedan '+(x.reps-caliRun.repDone)+' repeticiones';if(caliRun.repDone===x.reps)beep(950,.14)}
function toggleCali(){if(!caliRun)return;caliRun.paused=!caliRun.paused;$('#caliState').textContent=caliRun.paused?'Pausa':'Activo';$('#caliPlay').innerHTML=(caliRun.paused?icon('play')+' CONTINUAR':icon('pause')+' PAUSA')}
function completeCaliExercise(auto=false){if(!caliRun)return;clearGuide();if(caliRun.minuteLeft>0&&!auto){startRest(caliRun.minuteLeft,()=>advanceCali(),'Descanso hasta completar el minuto')}else advanceCali()}
function advanceCali(){caliRun.idx++;if(caliRun.idx>=5){caliRun.idx=0;caliRun.round++}if(caliRun.round>3){finishCali(caliRun.l);return}caliRun.repDone=0;caliRun.minuteLeft=60;caliRun.workLeft=null;state.active={kind:'cali',l:caliRun.l,w:caliRun.w,idx:caliRun.idx,round:caliRun.round,started:caliRun.started};save();renderCaliRun();startCaliTick()}
function startRest(sec,done,label='Descanso'){clearGuide();guideRemain=sec;guidePaused=false;render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">SERIE / EJERCICIO COMPLETADO</div><h2>${label}</h2><p>Recupera y prepárate para lo siguiente.</p></div><div class="roundTimer" id="restRing" style="--accent:var(--green);--pct:0%"><div><b id="restTime">${fmt(sec)}</b><span>descanso</span></div></div><div class="miniControls"><button onclick="toggleRest()" id="restPause">⏸ Pausa</button><button onclick="addRest(15)">+15 s</button><button onclick="skipRest()">Saltar ›</button></div>`,'Descanso');window._restDone=done;const total=sec;guideTimer=setInterval(()=>{if(guidePaused)return;guideRemain--;const e=$('#restTime');if(e)e.textContent=fmt(guideRemain);const r=$('#restRing');if(r)r.style.setProperty('--pct',((total-guideRemain)/Math.max(1,total)*100)+'%');if(guideRemain<=0){clearGuide();beep(1050,.18);const f=window._restDone;window._restDone=null;if(f)f()}},1000)}
function fmt(s){return Math.floor(s/60)+':'+String(Math.max(0,s%60)).padStart(2,'0')}
function toggleRest(){guidePaused=!guidePaused;$('#restPause').textContent=guidePaused?'▶ Continuar':'⏸ Pausa'}function addRest(n){guideRemain+=n;$('#restTime').textContent=fmt(guideRemain)}function skipRest(){clearGuide();const f=window._restDone;window._restDone=null;if(f)f()}
function finishCali(l){clearGuide();wake(false);const mins=caliRun?Math.max(1,Math.round((Date.now()-caliRun.started)/60000)):15;state.logs.push({date:new Date().toISOString(),kind:'cali',minutes:mins,level:l});state.active=null;save();caliRun=null;render(`<div class="sectionHead" style="--accent:var(--green)"><div class="kicker">CALISTENIA COMPLETADA</div><h2>Entrenamiento terminado ✓</h2><p>Sesión guardada en tu progreso.</p></div><button class="cta" style="--accent:var(--green)" onclick="home()">VOLVER AL INICIO</button>`,'Completado')}
function caliExercises(){const all=[...CALI2.principiante.w12,...CALI2.principiante.w34,...CALI2.intermedio.w12,...CALI2.intermedio.w34,...CALI2.avanzado.w12,...CALI2.avanzado.w34],seen={};const arr=all.filter(x=>!seen[x.n]&&(seen[x.n]=1));render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">BIBLIOTECA</div><h2>Ejercicios</h2><p>Técnica y músculos trabajados.</p></div>${arr.map(x=>`<div class="card"><b>${x.n}</b><div class="muscleList" style="--accent:var(--blue)">${x.m.map(m=>`<span class="muscle">${m}</span>`).join('')}</div><small class="muted">${x.reps?x.reps+' repeticiones de referencia':x.sec+' segundos de referencia'} · ejecución controlada</small></div>`).join('')}`,'Ejercicios')}
function caliPrograms(){render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">PROGRAMAS</div><h2>Entrena con objetivo</h2></div>${['15 min · 4 semanas · sin equipamiento','Fuerza y control','Resistencia muscular','Core y estabilidad','Progresiones técnicas'].map((x,i)=>`<div class="menuRow" style="--accent:var(--blue)" ${i===0?'onclick="caliLevels()"':''}><div class="mi">${icon(i===0?'play':'target')}</div><div><b>${x}</b><small>${i===0?'Programa principal completo':'Preparado para ampliar sin sustituir el programa original'}</small></div><div class="arrow">›</div></div>`).join('')}`,'Programas')}
function caliHistory(){const a=state.logs.filter(x=>x.kind==='cali').slice().reverse();render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">MIS ENTRENAMIENTOS</div><h2>Historial Calistenia</h2></div>${a.length?a.map(x=>`<div class="card"><b>${LEVELS[x.level]?.name||'Calistenia'} · ${x.minutes||15} min</b><small class="muted">${new Date(x.date).toLocaleString('es')}</small></div>`).join(''):'<div class="notice">Todavía no hay sesiones de Calistenia registradas.</div>'}`,'Historial')}
function caliChallenges(){const n=state.logs.filter(x=>x.kind==='cali').length;render(`<div class="sectionHead" style="--accent:var(--blue)"><div class="kicker">RETOS</div><h2>Constancia real</h2><p>Se calcula con tus sesiones guardadas.</p></div>${[['Primera sesión',1],['5 entrenamientos',5],['10 entrenamientos',10],['20 entrenamientos',20]].map(([t,v])=>`<div class="card"><div class="row"><div class="grow"><b>${t}</b><div class="progressbar" style="--accent:var(--blue)"><i style="width:${Math.min(100,n/v*100)}%"></i></div></div><b>${Math.min(n,v)}/${v}</b></div></div>`).join('')}`,'Retos Calistenia')}

// Gym: entrenamiento limpio, sin foto de máquina; anatomía + anexo
function workoutList(){const sessions=makePlan(selectedLevel,selectedType,selectedPlan,brand);window._gymItems=sessions.flatMap(s=>s.items);const color=brand==='life'?'var(--red)':'var(--yellow)';render(`<div class="sectionHead" style="--accent:${color}"><div class="kicker">ENTRENAMIENTO EN CURSO · ${brand==='life'?'LIFE FITNESS':'TECHNOGYM'}</div><h2>${PLANS[selectedLevel][selectedType][selectedPlan]}</h2><p>${window._gymItems.length} ejercicios · marca elegida para toda la sesión.</p></div>${window._gymItems.map((m,i)=>`<div class="menuRow" style="--accent:${color}" onclick="gymExercise(${i})"><div class="mi">${i+1}</div><div><b>${m.name}</b><small>${m.sets} series · ${m.reps} · ${m.muscles.slice(0,2).join(' + ')}</small></div><div class="arrow">›</div></div>`).join('')}<button class="cta" style="--accent:${color};--cta:${brand==='tech'?'#111':'#fff'}" onclick="gymExercise(0)">EMPEZAR ENTRENAMIENTO</button>`,'Entrenamiento')}
let gymRun=null;
function gymExercise(i){clearGuide();const items=window._gymItems||makePlan(selectedLevel,selectedType,selectedPlan,brand).flatMap(s=>s.items);const m=items[i];if(!m)return;const target=parseInt(String(m.reps).match(/\d+/)?.[0]||10);gymRun={items,i,m,set:1,sets:m.sets||3,target,done:0,paused:false,started:state.active?.started||Date.now()};renderGymExercise()}
function renderGymExercise(){const g=gymRun,m=g.m,c=brand==='life'?'var(--red)':'var(--yellow)',a=anatomyFor(m,brand),last=state.weights[m.id]||0;render(`<div class="sectionHead" style="--accent:${c}"><div class="kicker">EJERCICIO ${g.i+1}/${g.items.length} · SERIE ${g.set}/${g.sets}</div><h2>${m.name}</h2><p>${m.brand}${m.model?' · '+m.model:''}</p><button class="annexBtn" onclick="openAnnex('${m.id}')">${icon('book')} VER MÁQUINA EN ANEXO</button></div><div class="anatomyOnly"><img src="${a}" alt="Músculos trabajados"></div><div class="muscleList" style="--accent:${c}">${m.muscles.map((x,j)=>`<span class="muscle">${j===0?'Principal · ':''}${x}</span>`).join('')}${(m.secondary||[]).slice(0,2).map(x=>`<span class="muscle" style="opacity:.7">Secundario · ${x}</span>`).join('')}</div><div class="card"><div class="bigCounter"><span id="gymDone">${g.done}</span> / ${g.target}</div><div class="remain" id="gymRemain">Quedan ${g.target-g.done} repeticiones</div><div class="weightBox"><button onclick="gymRep(-1)">− REP</button><div style="text-align:center"><b id="gymKg">${last||0} kg</b><div class="tiny muted">peso actual</div></div><button onclick="gymRep(1)">REP +</button></div><div class="weightBox"><button onclick="gymWeight(-2.5)">−</button><div style="text-align:center;font-weight:900">AJUSTAR PESO</div><button onclick="gymWeight(2.5)">+</button></div></div><div class="controls" style="--accent:${c};--cta:${brand==='tech'?'#111':'#fff'}"><button class="controlBtn primary" id="gymPlay" onclick="toggleGym()">${icon('play')} PLAY</button><button class="controlBtn" onclick="completeGymSet()">✓ COMPLETAR SERIE</button></div><button class="controlBtn" style="width:100%" onclick="pauseWholeGym()">${icon('pause')} PAUSAR ENTRENAMIENTO</button>`,'Entrenamiento en curso')}
function gymRep(d){if(!gymRun||gymRun.paused)return;gymRun.done=Math.max(0,Math.min(gymRun.target,gymRun.done+d));$('#gymDone').textContent=gymRun.done;$('#gymRemain').textContent='Quedan '+(gymRun.target-gymRun.done)+' repeticiones';if(gymRun.done===gymRun.target)beep(950,.14)}
function gymWeight(d){const id=gymRun.m.id;state.weights[id]=Math.max(0,(parseFloat(state.weights[id])||0)+d);save();$('#gymKg').textContent=state.weights[id]+' kg'}
function toggleGym(){if(!gymRun)return;gymRun.paused=!gymRun.paused;$('#gymPlay').innerHTML=gymRun.paused?icon('play')+' CONTINUAR':icon('pause')+' PAUSA'}
function pauseWholeGym(){if(!gymRun)return;gymRun.paused=true;render(`<div class="sectionHead" style="--accent:var(--purple)"><div class="kicker">ENTRENAMIENTO PAUSADO</div><h2>Todo está detenido</h2><p>Serie ${gymRun.set}/${gymRun.sets} · ${gymRun.m.name} · ${gymRun.done}/${gymRun.target} repeticiones.</p></div><button class="cta" style="--accent:var(--purple)" onclick="renderGymExercise()">▶ CONTINUAR EXACTAMENTE DONDE ESTABA</button>`,'Pausa')}
function completeGymSet(){if(!gymRun)return;const kg=state.weights[gymRun.m.id]||0;state.history.push({id:gymRun.m.id,kg,reps:gymRun.done,set:gymRun.set,date:new Date().toISOString(),brand});save();if(gymRun.set<gymRun.sets){gymRun.set++;gymRun.done=0;startRest(90,()=>renderGymExercise(),'Descanso entre series')}else{gymRun.set=1;gymRun.done=0;gymRun.i++;if(gymRun.i>=gymRun.items.length){finishWorkout();return}gymRun.m=gymRun.items[gymRun.i];gymRun.sets=gymRun.m.sets||3;gymRun.target=parseInt(String(gymRun.m.reps).match(/\d+/)?.[0]||10);startRest(90,()=>renderGymExercise(),'Siguiente ejercicio: '+gymRun.m.name)}}

function gymTips(m){const k=gymKind(m);const d={chest:['Ajusta el asiento para que los agarres queden a la altura del pecho.','Empuja sin bloquear completamente los codos.','Vuelve despacio y mantén la espalda apoyada.'],lat:['Pecho alto y hombros lejos de las orejas.','Lleva la barra hacia la parte alta del pecho.','Controla la subida sin soltar el peso.'],row:['Mantén el torso estable y el pecho abierto.','Lleva los codos hacia atrás sin encoger hombros.','Regresa de forma controlada hasta extender los brazos.'],shoulder:['Ajusta el asiento y apoya bien la espalda.','Empuja arriba sin arquear la zona lumbar.','Baja hasta una posición cómoda y controlada.'],legpress:['Apoya toda la planta del pie.','Empuja sin bloquear las rodillas.','Baja hasta donde mantengas pelvis y espalda apoyadas.'],legext:['Alinea la rodilla con el eje de giro de la máquina.','Extiende con control sin golpear el tope.','Baja lentamente manteniendo tensión.'],legcurl:['Alinea la rodilla con el eje de giro.','Flexiona llevando los talones hacia atrás con control.','Evita despegar la cadera o acelerar la vuelta.'],generic:['Colócate estable antes de iniciar.','Realiza el recorrido de forma controlada.','Prioriza técnica y control sobre aumentar el peso.']};return d[k]||d.generic}
function saveGymSnapshot(phase='exercise'){if(!gymRun)return;state.active={kind:'gym',level:selectedLevel,type:selectedType,plan:selectedPlan,brand,started:gymRun.started,i:gymRun.i,set:gymRun.set,done:gymRun.done,target:gymRun.target,paused:gymRun.paused,phase};save()}
function startPlan(b){brand=b;workoutIndex=0;state.active={kind:'gym',level:selectedLevel,type:selectedType,plan:selectedPlan,brand:b,started:Date.now(),i:0,set:1,done:0,phase:'overview'};save();workoutList()}
function workoutList(){const sessions=makePlan(selectedLevel,selectedType,selectedPlan,brand);window._gymItems=sessions.flatMap(s=>s.items);const color=brand==='life'?'var(--red)':'var(--yellow)';render(`<div class="sectionHead" style="--accent:${color}"><div class="kicker">ENTRENAMIENTO EN CURSO · ${brand==='life'?'LIFE FITNESS':'TECHNOGYM'}</div><h2>${PLANS[selectedLevel][selectedType][selectedPlan]}</h2><p>${window._gymItems.length} ejercicios · se realizarán en este orden.</p></div>${window._gymItems.map((m,i)=>`<div class="menuRow" style="--accent:${color}"><div class="mi">${i+1}</div><div><b>${m.name}</b><small>${m.sets} series · ${m.reps} · ${m.muscles.slice(0,2).join(' + ')}</small></div></div>`).join('')}<div class="notice">Al terminar todas las series de un ejercicio, la app prepara automáticamente el siguiente. No tienes que volver al listado.</div><button class="cta" style="--accent:${color};--cta:${brand==='tech'?'#111':'#fff'}" onclick="startGymSequence()">EMPEZAR · EJERCICIO 1</button>`,'Entrenamiento')}
function startGymSequence(){const items=window._gymItems||makePlan(selectedLevel,selectedType,selectedPlan,brand).flatMap(s=>s.items);if(!items.length)return;gymRun={items,i:0,m:items[0],set:1,sets:items[0].sets||3,target:parseInt(String(items[0].reps).match(/\d+/)?.[0]||10),done:0,paused:false,started:state.active?.started||Date.now()};saveGymSnapshot('countdown');gymCountdown(()=>{wake(true);renderGymExercise()})}
function gymCountdown(cb){let n=3;const c=brand==='life'?'var(--red)':'var(--yellow)';render(`<div class="sectionHead" style="--accent:${c}"><div class="kicker">PREPÁRATE</div><h2>Comenzamos el entrenamiento</h2><p>Primer ejercicio: ${(window._gymItems||[])[0]?.name||''}</p></div><div id="gcd" class="countdown" style="--accent:${c}">3</div>`,'Cuenta atrás');beep(650);const t=setInterval(()=>{n--;if(n>0){const e=$('#gcd');if(e)e.textContent=n;beep(650)}else{clearInterval(t);beep(1050,.16);cb()}},1000)}
function gymExercise(i,resume=false){clearGuide();const items=window._gymItems||makePlan(selectedLevel,selectedType,selectedPlan,brand).flatMap(s=>s.items);const m=items[i];if(!m)return;const a=state.active&&state.active.kind==='gym'&&state.active.i===i?state.active:null;const target=parseInt(String(m.reps).match(/\d+/)?.[0]||10);gymRun={items,i,m,set:resume&&a?a.set||1:1,sets:m.sets||3,target:resume&&a?a.target||target:target,done:resume&&a?a.done||0:0,paused:resume&&a?!!a.paused:false,started:a?.started||state.active?.started||Date.now()};renderGymExercise()}
function renderGymExercise(){const g=gymRun,m=g.m,c=brand==='life'?'var(--red)':'var(--yellow)',a=anatomyFor(m,brand),last=state.weights[m.id]||0,next=g.items[g.i+1];saveGymSnapshot('exercise');const dots=Array.from({length:g.sets},(_,j)=>`<i class="${j+1<g.set?'done':j+1===g.set?'current':''}"></i>`).join('');const prog=g.items.map((_,j)=>`<i class="${j<g.i?'done':j===g.i?'current':''}"></i>`).join('');const tips=gymTips(m);render(`<div class="sectionHead" style="--accent:${c}"><div class="kicker">EJERCICIO ${g.i+1} DE ${g.items.length}</div><h2>${m.name}</h2><p>${m.brand}${m.model?' · '+m.model:''}</p><button class="annexBtn" onclick="openAnnex('${m.id}')">${icon('book')} VER MÁQUINA EN ANEXO</button></div><div class="exerciseProgress" style="--accent:${c}">${prog}</div>${exerciseActor(m)}<div class="anatomyOnly"><img src="${a}" alt="Músculos trabajados"></div><div class="muscleList" style="--accent:${c}">${m.muscles.map((x,j)=>`<span class="muscle">${j===0?'Principal · ':''}${x}</span>`).join('')}${(m.secondary||[]).slice(0,2).map(x=>`<span class="muscle" style="opacity:.72">Secundario · ${x}</span>`).join('')}</div><div class="techniqueMini"><b>Cómo hacerlo</b>${tips.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('')}</div><div class="card"><div class="tiny muted" style="text-align:center">SERIE ${g.set} DE ${g.sets}</div><div class="setDots" style="--accent:${c}">${dots}</div><div class="bigCounter"><span id="gymDone">${g.done}</span> / ${g.target}</div><div class="remain" id="gymRemain">Quedan ${Math.max(0,g.target-g.done)} repeticiones</div><div class="weightBox"><button onclick="gymRep(-1)">− REP</button><div style="text-align:center"><b id="gymKg">${last||0} kg</b><div class="tiny muted">peso actual</div></div><button onclick="gymRep(1)">REP +</button></div><div class="weightBox"><button onclick="gymWeight(-2.5)">−</button><div style="text-align:center;font-weight:900">AJUSTAR PESO</div><button onclick="gymWeight(2.5)">+</button></div></div><div class="controls" style="--accent:${c};--cta:${brand==='tech'?'#111':'#fff'}"><button class="controlBtn primary" id="gymPlay" onclick="toggleGym()">${g.paused?icon('play')+' CONTINUAR':icon('pause')+' PAUSA'}</button><button class="controlBtn" onclick="completeGymSet()">✓ COMPLETAR SERIE</button></div><button class="controlBtn" style="width:100%" onclick="pauseWholeGym()">${icon('pause')} PAUSAR ENTRENAMIENTO</button>${next?`<div class="nextPreview" style="--accent:${c}"><div class="nnum">${g.i+2}</div><div><b>Siguiente: ${next.name}</b><small>${next.sets} series · ${next.reps} · se abrirá automáticamente</small></div></div>`:'<div class="nextPreview" style="--accent:var(--green)"><div class="nnum">✓</div><div><b>Último ejercicio</b><small>Al terminar, guardaremos toda la sesión.</small></div></div>'}<div class="sessionClock"><div><small>TIEMPO TOTAL</small><b id="gymElapsed">${fmt(Math.floor((Date.now()-g.started)/1000))}</b></div><div><small>PROGRESO</small><b>${g.i+1}/${g.items.length}</b></div></div>`,'Entrenamiento en curso');clearInterval(window._gymClock);window._gymClock=setInterval(()=>{if(!gymRun||gymRun.paused)return;const e=$('#gymElapsed');if(e)e.textContent=fmt(Math.floor((Date.now()-gymRun.started)/1000))},1000)}
function gymRep(d){if(!gymRun||gymRun.paused)return;gymRun.done=Math.max(0,Math.min(gymRun.target,gymRun.done+d));const a=$('#gymDone'),b=$('#gymRemain');if(a)a.textContent=gymRun.done;if(b)b.textContent='Quedan '+(gymRun.target-gymRun.done)+' repeticiones';saveGymSnapshot();if(gymRun.done===gymRun.target)beep(950,.14)}
function gymWeight(d){if(!gymRun)return;const id=gymRun.m.id;state.weights[id]=Math.max(0,(parseFloat(state.weights[id])||0)+d);save();const e=$('#gymKg');if(e)e.textContent=state.weights[id]+' kg'}
function toggleGym(){if(!gymRun)return;gymRun.paused=!gymRun.paused;saveGymSnapshot();const e=$('#gymPlay');if(e)e.innerHTML=gymRun.paused?icon('play')+' CONTINUAR':icon('pause')+' PAUSA'}
function pauseWholeGym(){if(!gymRun)return;gymRun.paused=true;saveGymSnapshot('paused');clearInterval(window._gymClock);render(`<div class="sectionHead" style="--accent:var(--purple)"><div class="kicker">ENTRENAMIENTO PAUSADO</div><h2>Todo está detenido</h2><p>Ejercicio ${gymRun.i+1}/${gymRun.items.length} · serie ${gymRun.set}/${gymRun.sets} · ${gymRun.done}/${gymRun.target} repeticiones.</p></div><button class="cta" style="--accent:var(--purple)" onclick="gymRun.paused=false;renderGymExercise()">▶ CONTINUAR EXACTAMENTE DONDE ESTABA</button>`,'Pausa')}
function completeGymSet(){if(!gymRun)return;const kg=state.weights[gymRun.m.id]||0;state.history.push({id:gymRun.m.id,kg,reps:gymRun.done,set:gymRun.set,date:new Date().toISOString(),brand});save();if(gymRun.set<gymRun.sets){gymRun.set++;gymRun.done=0;saveGymSnapshot('rest');startRest(90,()=>{gymRun.paused=false;renderGymExercise()},'Descanso · siguiente serie')}else{const finished=gymRun.m.name;gymRun.set=1;gymRun.done=0;gymRun.i++;if(gymRun.i>=gymRun.items.length){finishWorkout();return}gymRun.m=gymRun.items[gymRun.i];gymRun.sets=gymRun.m.sets||3;gymRun.target=parseInt(String(gymRun.m.reps).match(/\d+/)?.[0]||10);saveGymSnapshot('transition');startRest(90,()=>{gymRun.paused=false;beep(980,.12);renderGymExercise()},finished+' completado · sigue '+gymRun.m.name)}}
function openAnnex(id){const m=allMachines().find(x=>x.id===id);if(!m)return;const c=id.startsWith('life')?'var(--red)':'var(--yellow)';if(gymRun)saveGymSnapshot('annex');render(`<div class="sectionHead" style="--accent:${c}"><div class="kicker">ANEXO / CATÁLOGO</div><h2>${m.name}</h2><p>${m.brand}${m.model?' · '+m.model:''}</p></div><div class="visual" style="min-height:300px"><img src="${m.detail||m.img}" style="height:290px" alt="${m.name}"></div><div class="card"><b>Cómo reconocerla</b><p class="muted small">Busca la marca y el nombre de la máquina. Comprueba la forma del asiento, respaldo, agarres y el sistema de carga antes de empezar.</p></div><div class="card"><b>Músculos trabajados</b><div class="muscleList" style="--accent:${c}">${m.muscles.map(x=>`<span class="muscle">${x}</span>`).join('')}</div></div>${gymRun?`<button class="cta" style="--accent:${c};--cta:${brand==='tech'?'#111':'#fff'}" onclick="renderGymExercise()">← VOLVER AL ENTRENAMIENTO</button>`:`<button class="cta" style="--accent:${c};--cta:${id.startsWith('tech')?'#111':'#fff'}" onclick="catalog('${id.startsWith('life')?'life':'tech'}')">← VOLVER AL CATÁLOGO</button>`}`,'Anexo de máquina')}
function annexHome(){render(`<div class="sectionHead" style="--accent:var(--purple)"><div class="kicker">ANEXO / CATÁLOGO DE MÁQUINAS</div><h2>Encuentra la máquina que necesitas</h2><p>Catálogos separados por gimnasio.</p></div><div class="annexBrand" onclick="catalog('life')"><b style="color:var(--red)">Life Fitness</b><small>Máquinas, músculos, imágenes y técnica</small></div><div class="annexBrand" onclick="catalog('tech')"><b style="color:var(--yellow)">Technogym</b><small>Máquinas, músculos, imágenes y técnica</small></div>`,'Anexo')}
function resumeActiveSession(){const a=state.active;if(!a||a.kind!=='gym')return false;selectedLevel=a.level;selectedType=a.type;selectedPlan=a.plan;brand=a.brand;window._gymItems=makePlan(selectedLevel,selectedType,selectedPlan,brand).flatMap(s=>s.items);const m=window._gymItems[a.i||0];if(!m)return false;gymRun={items:window._gymItems,i:a.i||0,m,set:a.set||1,sets:m.sets||3,target:a.target||parseInt(String(m.reps).match(/\d+/)?.[0]||10),done:a.done||0,paused:!!a.paused,started:a.started||Date.now()};const c=brand==='life'?'var(--red)':'var(--yellow)';render(`<div class="sectionHead" style="--accent:${c}"><div class="kicker">ENTRENAMIENTO GUARDADO</div><h2>¿Continuamos?</h2><p>${m.name} · serie ${gymRun.set}/${gymRun.sets} · ${gymRun.done}/${gymRun.target} repeticiones.</p></div><button class="cta" style="--accent:${c};--cta:${brand==='tech'?'#111':'#fff'}" onclick="gymRun.paused=false;renderGymExercise()">CONTINUAR ENTRENAMIENTO</button><button class="controlBtn" style="width:100%;margin-top:8px" onclick="state.active=null;save();home()">NO, VOLVER AL INICIO</button>`,'Reanudar');return true}


// ===== MOCKUP GYM/ANEXO · OVERRIDES VISUALES V6 =====
function setNav(n){['Home','Cal','Train','Prog','Profile'].forEach(x=>{const e=$('#nav'+x);if(e)e.classList.toggle('on',x===n)})}
function svgIcon(n){const p={routines:'<path d="M7 20V10M12 20V4M17 20v-7M4 10h6M9 4h6M14 13h6"/>',cali:'<circle cx="12" cy="5" r="2"/><path d="M6 21l3-7 3 2 3-6 3 11M4 9l5 3 3-3 4 3 4-2"/>',weights:'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/><path d="M7 12h3l1-2 2 4 1-2h3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9A1.7 1.7 0 0 0 21 10h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${p[n]||p.search}</svg>`}
function home(push=false){stack=[];setNav('Home');render(`<div class="mockPage mockHomePage"><div class="mockHome"><div class="mockLogo"><div class="dmf">DM FITNESS</div><div class="motto">DISCIPLINA · PROGRESO · RESULTADOS</div></div><div class="mockGrid"><div class="mockTile purple" onclick="routinesHome()"><div class="mi2">${svgIcon('routines')}</div><b>DM RUTINAS</b><small>Planes de entrenamiento</small></div><div class="mockTile blue" onclick="caliHome()"><div class="mi2">${svgIcon('cali')}</div><b>CALISTENIA</b><small>Entrena con tu propio peso</small></div><div class="mockTile red" onclick="catalog('life')"><div class="mi2">${svgIcon('weights')}</div><b>LIFE FITNESS</b><small>Catálogo de máquinas</small></div><div class="mockTile yellow" onclick="catalog('tech')"><div class="mi2">${svgIcon('weights')}</div><b>TECHNOGYM</b><small>Catálogo de máquinas</small></div><div class="mockTile green" onclick="cardioHome()"><div class="mi2">${svgIcon('heart')}</div><b>CARDIO</b><small>Clases y entrenamientos</small></div><div class="mockTile dark" onclick="annexHome()"><div class="mi2">${svgIcon('search')}</div><b>ANEXO / CATÁLOGO</b><small>Todas las máquinas</small></div><div class="mockTile dark" onclick="profile()"><div class="mi2">${svgIcon('user')}</div><b>MI PERFIL</b><small>Tu progreso</small></div><div class="mockTile dark" onclick="openSettings()"><div class="mi2">${svgIcon('gear')}</div><b>AJUSTES</b><small>Personaliza la app</small></div></div></div></div>`,'DM FITNESS',false)}
function catalog(b){setNav(null);const arr=DB[b];render(`<div class="mockPage catalogPage"><button class="mockBack" onclick="goBack()">‹</button><div class="screenTitle">Catálogo de Máquinas</div><div class="catalogTabs"><button class="${b==='life'?'on':''}" onclick="catalog('life')">Life Fitness</button><button class="${b==='tech'?'on':''}" onclick="catalog('tech')">Technogym</button></div><input class="catalogSearch" id="q" placeholder="Buscar máquina..." oninput="filterCatalogMock('${b}')"><div id="catListMock">${machineCardsMock(arr)}</div></div>`,'Catálogo de Máquinas')}
function machineCardsMock(arr){return arr.map((m,i)=>`<div class="catMockRow ${i===0?'sel':''}" onclick="openAnnex('${m.id}')"><img src="${m.img}" alt="${m.name}"><div><b>${m.name}</b><small>${m.brand}${m.model?' · '+m.model:''}</small></div><div class="arrow">›</div></div>`).join('')}
function filterCatalogMock(b){const q=($('#q').value||'').toLowerCase();$('#catListMock').innerHTML=machineCardsMock(DB[b].filter(m=>(m.name+' '+m.muscles.join(' ')).toLowerCase().includes(q)))}
function renderGymExercise(){const g=gymRun,m=g.m,last=state.weights[m.id]||0,next=g.items[g.i+1];saveGymSnapshot('exercise');const dots=Array.from({length:g.sets},(_,j)=>`<i class="${j+1<g.set?'done':j+1===g.set?'current':''}"></i>`).join('');const pct=Math.round((g.i/g.items.length)*100+((g.set-1)/g.sets)*(100/g.items.length));render(`<div class="mockPage workMock"><button class="mockBack" onclick="workoutList()">‹</button><div class="workHead"><div class="workTitle">Entrenamiento en curso</div><div class="workSub">Torso / Pierna · ${PLANS[selectedLevel]?.[selectedType]?.[selectedPlan]||'Plan'}</div><div class="gymTopProgress"><i style="width:${pct}%"></i></div><div class="exNo">Ejercicio ${g.i+1} de ${g.items.length}</div><h2 class="exName">${m.name.toUpperCase()}</h2><div class="exModel">${m.brand}${m.model?' · '+m.model:''}</div><button class="annexSmall" onclick="openAnnex('${m.id}')">▣ &nbsp; Ver máquina en anexo</button></div><div class="machineHero"><img src="${m.detail||m.img}" alt="${m.name}"></div><div class="setCardMock"><div class="setLine">Serie ${g.set} de ${g.sets}</div><div class="setDotsMock">${dots}</div><div class="repBig"><span id="gymDone">${g.done}</span> / ${g.target}</div><div class="repRemain" id="gymRemain">Quedan ${Math.max(0,g.target-g.done)} repeticiones</div><div class="kgMock"><button onclick="gymWeight(-2.5)">−</button><b id="gymKg">${last||0} kg</b><button onclick="gymWeight(2.5)">+</button></div></div><div class="gymActions"><button class="pauseBig" id="gymPlay" onclick="toggleGym()">${g.paused?'▶':'Ⅱ'}</button><button class="completeBig" onclick="completeGymSet()">✓<br>Completar<br>serie</button></div><div class="sessionBottom"><div><b>◷</b><small>Descanso automático</small></div><div onclick="pauseWholeGym()"><b>Ⅱ</b><small>Pausar entrenamiento</small></div><div><b id="gymElapsed">${fmt(Math.floor((Date.now()-g.started)/1000))}</b><small>Tiempo total</small></div></div>${next?`<button class="nextExerciseBtn" onclick="completeGymSet()">Ver siguiente ejercicio →</button>`:''}</div>`,'Entrenamiento en curso');clearInterval(window._gymClock);window._gymClock=setInterval(()=>{if(!gymRun||gymRun.paused)return;const e=$('#gymElapsed');if(e)e.textContent=fmt(Math.floor((Date.now()-gymRun.started)/1000))},1000)}
function startRest(sec,done,title='Descanso entre series'){if(window._rest)clearInterval(window._rest);let left=sec;const renderRest=()=>render(`<div class="mockPage restPage"><button class="mockBack" onclick="renderGymExercise()">‹</button><div class="restMock"><h2>${title.includes('sigue')?'Descanso entre ejercicios':'Descanso entre series'}</h2><div class="restRing"><div><small>Descansa</small><b id="restTime">${fmt(left)}</b></div></div><div class="restBtns"><button onclick="left+=15;document.getElementById('restTime').textContent=fmt(left)">◷ &nbsp; +15 segundos</button><button onclick="clearInterval(window._rest);window._restDone&&window._restDone()">≫ &nbsp; Saltar descanso</button></div><div class="nextRest"><small>${title}</small><b>${gymRun?`Serie ${gymRun.set} de ${gymRun.sets} · ${gymRun.m.name}`:'Prepárate'}</b></div></div></div>`,'Descanso');window._restDone=done;renderRest();window._rest=setInterval(()=>{left--;const e=$('#restTime');if(e)e.textContent=fmt(left);if(left<=0){clearInterval(window._rest);done()}},1000)}
function showExerciseCompleted(finished,next){render(`<div class="mockPage completePage"><div class="completeMock"><div class="checkOrb">✓</div><h2>¡Ejercicio finalizado!</h2><h3>${finished.name.toUpperCase()}</h3><p class="muted small">${finished.sets||3} de ${finished.sets||3} series completadas</p><div class="summaryBox"><div class="sumrow"><span>Mejor serie</span><b>${gymRun?gymRun.target:0} rep · ${state.weights[finished.id]||0} kg</b></div><div class="sumrow"><span>Tiempo de ejercicio</span><b>Completado</b></div></div>${next?`<button class="cta" style="--accent:var(--blue)" onclick="startRest(90,()=>renderGymExercise(),'${finished.name} completado · sigue ${next.name}')">Siguiente ejercicio →</button><div class="nextMachine"><img src="${next.img}" alt="${next.name}"><div><small>Próximo ejercicio</small><b>${next.name}</b><small>${next.sets} series · ${next.reps}</small></div></div>`:''}</div></div>`,'Ejercicio completado')}
function completeGymSet(){if(!gymRun)return;const kg=state.weights[gymRun.m.id]||0;state.history.push({id:gymRun.m.id,kg,reps:gymRun.done,set:gymRun.set,date:new Date().toISOString(),brand});save();if(gymRun.set<gymRun.sets){gymRun.set++;gymRun.done=0;saveGymSnapshot('rest');startRest(90,()=>{gymRun.paused=false;renderGymExercise()},'Siguiente serie')}else{const finished=gymRun.m;gymRun.set=1;gymRun.done=0;gymRun.i++;if(gymRun.i>=gymRun.items.length){finishWorkout();return}gymRun.m=gymRun.items[gymRun.i];gymRun.sets=gymRun.m.sets||3;gymRun.target=parseInt(String(gymRun.m.reps).match(/\d+/)?.[0]||10);saveGymSnapshot('transition');showExerciseCompleted(finished,gymRun.m)}}
function openAnnex(id){const m=allMachines().find(x=>x.id===id);if(!m)return;if(gymRun)saveGymSnapshot('annex');const isTech=id.startsWith('tech');render(`<div class="mockPage sheetPage"><button class="mockBack" onclick="${gymRun?'renderGymExercise()':`catalog('${isTech?'tech':'life'}')`}">‹</button><div class="screenTitle">Ficha de Máquina</div><div class="machineSheet"><span class="brandPill">${m.brand}</span><h2>${m.name.toUpperCase()}</h2><div class="muted small">${m.model||''}</div><div class="heroImg"><img src="${m.detail||m.img}" alt="${m.name}"></div><div class="dotsCar"><i class="on"></i><i></i><i></i></div><div class="machineInfoCard"><h3>Músculos trabajados</h3><div class="muscleList" style="--accent:${isTech?'var(--yellow)':'var(--red)'}">${m.muscles.map(x=>`<span class="muscle">${x}</span>`).join('')}</div></div><div class="machineInfoCard"><h3>Regulación principal</h3><ul><li>Ajusta asiento y respaldo a una posición cómoda.</li><li>Comprueba agarres y recorrido antes de cargar peso.</li><li>Usa un movimiento controlado durante toda la serie.</li></ul></div>${gymRun?`<button class="cta" style="--accent:var(--blue)" onclick="renderGymExercise()">← Volver al entrenamiento</button>`:`<button class="cta" style="--accent:var(--blue)" onclick="catalog('${isTech?'tech':'life'}')">← Volver al catálogo</button>`}</div></div>`,'Ficha de Máquina')}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})},30000);if(!resumeActiveSession())home();
</script></body></html>

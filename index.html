function head(title,sub='',backFn='back()'){return `<div class="top"><button class="back" onclick="${backFn}">‹</button><div style="flex:1"><h1>${title}</h1>${sub?`<div style="text-align:center;font-size:8px;color:#8fa8b6">${sub}</div>`:''}</div><button class="plain"></button></div>`}
function home(){stack=[];render(`<div class="page"><div class="brand"><span class="dm">DM</span><span class="fit">FITNESS</span><small>DISCIPLINA HOY · RESULTADOS MAÑANA</small></div><div class="hero" style="background-image:url('${HERO}')"><div class="heroCopy"><h2>TU MEJOR VERSIÓN<br>EMPIEZA AQUÍ</h2><button class="primary" onclick="gym()">▶ &nbsp; COMENZAR ENTRENAMIENTO</button></div></div><div class="quick"><div class="quickCard" onclick="gym()"><div class="ico">${icon('gym')}</div><b>GYM</b><small>Máquinas · Mancuernas<br>Peso corporal</small></div><div class="quickCard" onclick="calisthenics()"><div class="ico">${icon('bolt')}</div><b>CALISTENIA</b><small>Fuerza en libertad</small></div><div class="quickCard" onclick="catalog()"><div class="ico">${icon('exercise')}</div><b>EJERCICIOS</b><small>Catálogo visual</small></div><div class="quickCard" onclick="progress()"><div class="ico">${icon('chart')}</div><b>PROGRESO</b><small>Tu evolución</small></div></div><div class="quote">“DISCIPLINA HOY, RESULTADOS MAÑANA”</div></div>`,'home',false)}
function gym(level=S.level,mode=S.mode){S.level=level;S.mode=mode;save();const names=PLAN_NAMES[mode];render(`${head('GYM','PLANES DE ENTRENAMIENTO','home()')}<div class="page"><div class="seg">${LEVELS.map((x,i)=>`<button class="${i===level?'on':''}" onclick="gym(${i},'${mode}')">${x}</button>`).join('')}</div><div class="modes">${['diario','semanal','mensual'].map(m=>`<button class="${m===mode?'on':''}" onclick="gym(${level},'${m}')">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>${names.map((n,i)=>{const e=EX[(i*3+level)%EX.length];return `<div class="plan" onclick="planDetail(${i})"><div class="planArt">${poseSVG(e.kind,1)}</div><div><b>${n}</b><small>${mode==='diario'?'1 sesión completa':mode==='semanal'?`${3+i%3} días/semana`:'4 semanas · progresión'}</small><small class="meta">${level===0?'Técnica · Salud':level===1?'Hipertrofia · Fuerza':'Volumen · Intensidad'}</small></div><div class="arr">›</div></div>`}).join('')}<div class="info"><h3>Consejo</h3><div style="font-size:10px;color:#c1d0d8">La constancia siempre gana al talento.</div></div></div>`,'gym')}
function planDetail(i){const name=PLAN_NAMES[S.mode][i],ids=i%2?['incline','pulldown','squat','shoulder','curl','plank']:['bench','row','legpress','fly','hinge','lateral'];const items=ids.map(id=>EX.find(x=>x.id===id));render(`${head(name,`${LEVELS[S.level]} · ${S.mode}`)}<div class="page"><div class="sectionTitle"><h1>${name}</h1><small>${S.mode==='mensual'?'PROGRAMA DE 4 SEMANAS':'ENTRENAMIENTO GUIADO'}</small></div>${items.map((e,j)=>`<div class="groupRow" onclick="exerciseDetail('${e.id}')"><div class="groupThumb">${poseSVG(e.kind,j%2)}</div><div><b>${j+1}. ${e.name}</b><small>${e.sets} series · ${e.timed?e.reps+' s':e.reps+' repeticiones'} · ${e.rest}s descanso</small></div><div class="arr">›</div></div>`).join('')}<button class="primary" onclick="startWorkout(${JSON.stringify(ids).replace(/"/g,'&quot;')})">▶ &nbsp; INICIAR ENTRENAMIENTO</button></div>`,'gym')}
function catalog(tool=catalogTool,group=catalogGroup){catalogTool=tool;catalogGroup=group;const groups=['Todos','Pecho','Espalda','Hombros','Brazos','Piernas','Core'];let list=EX.filter(e=>(tool==='Todas'||e.tool===tool)&&(group==='Todos'||e.group===group));render(`${head('Ejercicios','CATÁLOGO VISUAL','home()')}<div class="page"><input class="search" placeholder="Buscar ejercicio…" oninput="searchExercises(this.value)"><div class="chips">${['Todas','Máquinas','Mancuernas','Peso corporal'].map(x=>`<button class="${x===tool?'on':''}" onclick="catalog('${x}','${group}')">${x}</button>`).join('')}</div><div class="chips">${groups.map(x=>`<button class="${x===group?'on':''}" onclick="catalog('${tool}','${x}')">${x}</button>`).join('')}</div><div class="exerciseGrid" id="exgrid">${list.map(exTile).join('')}</div></div>`,'ex')}
function exTile(e){return `<div class="exTile" data-name="${e.name.toLowerCase()}" onclick="exerciseDetail('${e.id}')"><div class="art">${poseSVG(e.kind,1)}</div><b>${e.name}</b><small>${e.group} · ${e.tool}</small></div>`}function searchExercises(q){q=q.toLowerCase();$$('#exgrid .exTile').forEach(x=>x.style.display=x.dataset.name.includes(q)?'block':'none')}
function muscleSVG(i){const hi=['#ff4f59','#ffb347','#3ddc97'][i%3];return `<svg viewBox="0 0 110 170" aria-hidden="true"><defs><linearGradient id="skinM${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2c09e"/><stop offset=".5" stop-color="#bb7654"/><stop offset="1" stop-color="#70412f"/></linearGradient><linearGradient id="darkM${i}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263744"/><stop offset="1" stop-color="#101b23"/></linearGradient><radialGradient id="musM${i}"><stop offset="0" stop-color="#ff8a8f"/><stop offset=".6" stop-color="${hi}"/><stop offset="1" stop-color="#8d242c"/></radialGradient><filter id="shM${i}"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".35"/></filter></defs><g filter="url(#shM${i})"><ellipse cx="55" cy="20" rx="13" ry="16" fill="url(#skinM${i})"/><path d="M45 10q10-12 22 0l-2 6q-11-7-20 0z" fill="#16191c"/><path d="M38 38Q55 29 72 38L82 82Q72 104 55 105Q38 104 28 82Z" fill="url(#skinM${i})"/><path d="M42 44Q55 38 68 44L72 67Q55 78 38 67Z" fill="${i===0?'url(#musM0)':'rgba(255,255,255,.10)'}"/><path d="M29 47Q18 59 18 88L28 91Q34 67 42 58Z" fill="${i===1?'url(#musM1)':'url(#skinM'+i+')'}"/><path d="M81 47Q92 59 92 88L82 91Q76 67 68 58Z" fill="${i===1?'url(#musM1)':'url(#skinM'+i+')'}"/><path d="M43 78Q55 73 67 78L69 104Q55 111 41 104Z" fill="${i===2?'url(#musM2)':'url(#skinM'+i+')'}"/><path d="M42 104L35 157L48 158L55 113L62 158L75 157L68 104Z" fill="url(#darkM${i})"/><path d="M39 104Q45 120 50 136" stroke="#98a9b4" stroke-width="1.5" opacity=".55"/><path d="M71 104Q65 120 60 136" stroke="#98a9b4" stroke-width="1.5" opacity=".55"/><path d="M48 46Q55 52 62 46M45 58Q55 63 65 58M48 71Q55 75 62 71" fill="none" stroke="#6f4636" stroke-width="1.4" opacity=".65"/><path d="M44 22q4 4 11 4t11-4" fill="none" stroke="#704735" stroke-width="1"/></g></svg>`}
function usesAI(e){return ['press','incline','fly'].includes(e.kind)||e.group==='Pecho'}
function aiMotion(e,small=false){if(!usesAI(e))return `<div class="${small?'trainMotion':'motionCard'}" style="--cad:${S.cadence}s"><div class="motionStage"><div class="pose p0">${poseSVG(e.kind,0)}</div><div class="pose p1">${poseSVG(e.kind,1)}</div></div><div class="motionLabel">MOVIMIENTO 3D</div></div>`;return `<div class="ai3dStage ${small?'trainMotion aiMotion':''}" style="--cad:${S.cadence}s"><img class="aiFrame a" src="${AI_PRESS_A}" alt=""><img class="aiFrame b" src="${AI_PRESS_B}" alt=""><div class="ai3dBadge">IA · 3D</div><div class="ai3dLabel">${e.name} · Inicio ⇄ Final</div></div>`}
function anatomy3D(id){const e=EX.find(x=>x.id===id);render(`${head('Anatomía 3D',e.name,'back()')}<div class="page"><div class="anatomy3dCard"><div class="anatomyGlow"></div><div class="anatomy3dModel"><img src="${AI_ANATOMY}" alt="Modelo anatómico 3D"></div><div class="ai3dBadge">MODELO ANATÓMICO 3D</div></div><div class="anatLegend">${e.mus.slice(0,3).map((m,i)=>`<div><span class="dot3d" style="background:${['#ff535c','#ffb347','#45d7a4'][i]}"></span><b>${m}</b></div>`).join('')}</div><div class="info"><h3>Músculos implicados</h3><div style="font-size:10px;line-height:1.55;color:#c5d5de">Vista anatómica con profundidad, sombreado y giro 3D suave.</div></div></div>`,'ex')}
function exerciseDetail(id){const e=EX.find(x=>x.id===id);render(`${head('Ejercicio','','back()')}<div class="page detail"><h1>${e.name}</h1><div class="musLine">${e.mus.join(' · ')}</div>${aiMotion(e)}<div class="pair"><div class="poseCard">${poseSVG(e.kind,0)}<b>1 · Inicio</b></div><div class="poseCard">${poseSVG(e.kind,1)}<b>2 · Final</b></div></div><button class="primary ai3dButton" onclick="anatomy3D('${id}')">🧬 &nbsp; VER ANATOMÍA 3D</button><div class="tabs"><button class="on">Músculos</button><button>Técnica</button><button>Consejos</button></div><div class="muscles">${e.mus.slice(0,3).map((m,i)=>`<div class="muscle">${muscleSVG(i)}<small>${m}</small></div>`).join('')}</div><div class="info"><h3>Ejecución correcta</h3>${['Colócate estable antes de comenzar.','Realiza el recorrido de forma controlada.','Mantén el core activo y evita impulsos.','Respira y conserva una técnica limpia.'].map((x,i)=>`<div class="step"><i>${i+1}</i><span>${x}</span></div>`).join('')}</div><button class="primary" onclick="startWorkout(['${id}'])">▶ &nbsp; ENTRENAR ESTE EJERCICIO</button></div>`,'ex')}
function startWorkout(ids,kind='gym'){clearInterval(timer);run={kind,ids,i:0,set:1,rep:0,paused:false,resting:false,started:Date.now()};localStorage.setItem('dmfit_active',JSON.stringify(run));renderWorkout();startCounter()}
function currentEx(){return EX.find(x=>x.id===run.ids[run.i])||CALI[run.i%CALI.length]}
function renderWorkout(){if(!run)return;const e=currentEx(),pct=((run.i+(run.set-1)/e.sets)/run.ids.length)*100,rpct=e.timed?(run.rep/e.reps*360):(run.rep/e.reps*360),next=EX.find(x=>x.id===run.ids[run.i+1]);render(`${head('Entrenamiento',`${run.kind==='cali'?'CALISTENIA':'GYM'} · ${LEVELS[S.level]}`,'pauseRun()')}<div class="page"><div style="font-size:10px;color:#b7c7cf">Ejercicio ${run.i+1} de ${run.ids.length}</div><div class="trainProgress"><i style="width:${Math.max(3,pct)}%"></i></div><div class="trainCard"><h2>${e.name}</h2><div class="musLine">${e.mus.slice(0,3).join(' · ')}</div><div class="trainVisual">${aiMotion(e,true)}<div class="counter"><div class="ring" id="ring" style="--pct:${rpct}deg"><div class="ringInner"><small>${e.timed?'TIEMPO':'REPETICIÓN'}</small><b id="repnum">${run.rep}</b><em>/ ${e.reps}${e.timed?'s':''}</em></div></div><div class="series">SERIE ${run.set} / ${e.sets}</div><div class="countBtns"><button onclick="adjustRep(-1)">−</button><button class="pause" id="pausebtn" onclick="toggleRun()">${run.paused?'▶':'Ⅱ'}</button><button onclick="adjustRep(1)">+</button></div></div></div></div><div class="metrics"><div class="metric" onclick="weightChange('${e.id}',2.5)"><small>PESO</small><b id="kg">${S.weights[e.id]||0} kg</b></div><div class="metric"><small>RITMO</small><b>${S.cadence}s</b></div><div class="metric"><small>DESCANSO</small><b>${e.rest}s</b></div></div>${next?`<div class="nextCard"><div class="mini">${poseSVG(next.kind,1)}</div><div><small>Siguiente ejercicio</small><b>${next.name}</b></div><div class="arr">›</div></div>`:''}</div>`,'gym',false);localStorage.setItem('dmfit_active',JSON.stringify(run))}
function startCounter(){clearInterval(timer);if(!run||run.paused||run.resting)return;const e=currentEx(),ms=e.timed?1000:Math.max(1500,S.cadence*1000);timer=setInterval(()=>{if(!run||run.paused||run.resting)return;run.rep++;const n=$('#repnum'),r=$('#ring');if(n)n.textContent=run.rep;if(r)r.style.setProperty('--pct',(run.rep/e.reps*360)+'deg');localStorage.setItem('dmfit_active',JSON.stringify(run));if(run.rep>=e.reps){clearInterval(timer);beep();setTimeout(finishSet,350)}},ms)}
function toggleRun(){if(!run)return;run.paused=!run.paused;renderWorkout();if(!run.paused)startCounter()}function pauseRun(){if(run){run.paused=true;localStorage.setItem('dmfit_active',JSON.stringify(run))}home()}
function adjustRep(d){if(!run)return;const e=currentEx();run.rep=Math.max(0,Math.min(e.reps,run.rep+d));renderWorkout();startCounter()}function weightChange(id,d){S.weights[id]=Math.max(0,(S.weights[id]||0)+d);save();const x=$('#kg');if(x)x.textContent=S.weights[id]+' kg'}
function finishSet(){const e=currentEx();S.logs.push({date:new Date().toISOString(),kind:run.kind,id:e.id,reps:e.reps,kg:S.weights[e.id]||0});save();if(run.set<e.sets){run.set++;run.rep=0;startRest(e.rest)}else if(run.i<run.ids.length-1){run.i++;run.set=1;run.rep=0;startRest(e.rest)}else finishWorkout()}
function startRest(sec){run.resting=true;let left=sec;$('#overlay').innerHTML=`<div class="restOverlay"><div class="restBox"><small>DESCANSO AUTOMÁTICO</small><h2>Recupera y prepárate</h2><div class="restRing" id="restnum">${fmt(left)}</div><div class="restActions"><button onclick="addRest(15)">+15 s</button><button onclick="skipRest()">Saltar descanso</button></div></div></div>`;clearInterval(restTimer);restTimer=setInterval(()=>{left--;const x=$('#restnum');if(x)x.textContent=fmt(left);if(left<=0){clearInterval(restTimer);skipRest()}},1000);window._rest={get:()=>left,set:v=>left=v}}
function addRest(s){if(window._rest)window._rest.set(window._rest.get()+s)}function skipRest(){clearInterval(restTimer);$('#overlay').innerHTML='';if(!run)return;run.resting=false;renderWorkout();startCounter()}
function finishWorkout(){clearInterval(timer);localStorage.removeItem('dmfit_active');const elapsed=Math.round((Date.now()-run.started)/60000);S.logs.push({date:new Date().toISOString(),kind:run.kind,session:true,minutes:elapsed});save();run=null;render(`${head('Entrenamiento completado','','home()')}<div class="page" style="text-align:center;padding-top:50px"><div style="width:100px;height:100px;border-radius:50%;background:#0c3851;border:3px solid var(--blue);display:grid;place-items:center;margin:auto;font-size:45px">✓</div><h1>¡Sesión completada!</h1><p style="color:#a8bbc5">Buen trabajo. El entrenamiento ha quedado guardado en tu progreso.</p><button class="primary" onclick="progress()">VER PROGRESO</button></div>`,'progress',false)}
function calisthenics(){const items=[['Programa 15 minutos','Circuito guiado · 5 ejercicios'],['Tren superior','Flexiones · Dominadas · Core'],['Tren inferior','Sentadillas · Zancadas · Core'],['Full Calistenia','Todo el cuerpo · sin material']];render(`${head('CALISTENIA','FUERZA EN LIBERTAD','home()')}<div class="page"><div class="seg">${LEVELS.map((x,i)=>`<button class="${i===S.level?'on':''}" onclick="S.level=${i};save();calisthenics()">${x}</button>`).join('')}</div>${items.map((x,i)=>{const e=CALI[i%CALI.length];return `<div class="plan" onclick="startCali(${i})"><div class="planArt">${poseSVG(e.kind,1)}</div><div><b>${x[0]}</b><small>${x[1]}</small><small class="meta">Conteo automático · Movimiento guiado</small></div><div class="arr">›</div></div>`}).join('')}</div>`,'more')}
function startCali(i){const sets=i===0?['squat','pushup','lunge','mountain','plank']:i===1?['pushup','pullup','plank']:i===2?['squat','lunge','mountain']:['squat','pushup','lunge','mountain','plank'];startWorkout(sets,'cali')}
function cardio(){const names=['Cinta de correr','Bicicleta estática','Elíptica','Remo','HIIT 20 min'];render(`${head('Cardio','MEJORA TU RESISTENCIA','more()')}<div class="page">${names.map((n,i)=>`<div class="moreCard" onclick="toast('Sesión ${n} preparada')"><div class="ico">${icon('heart')}</div><div><b>${n}</b><small>${20+i*5} min · sesión guiada</small></div><div class="arr">›</div></div>`).join('')}</div>`,'more')}
function progress(){const sessions=S.logs.filter(x=>x.session).length,mins=S.logs.filter(x=>x.session).reduce((a,x)=>a+(x.minutes||0),0),vol=Math.round(S.logs.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0));render(`${head('Progreso','TU EVOLUCIÓN','home()')}<div class="page"><div class="seg"><button class="on">Resumen</button><button>Estadísticas</button><button>Historial</button></div><div class="stats"><div class="stat"><small>Entrenamientos</small><b>${sessions}</b><em>actividad registrada</em></div><div class="stat"><small>Tiempo total</small><b>${Math.floor(mins/60)}h ${mins%60}m</b><em>constancia</em></div><div class="stat"><small>Volumen total</small><b>${vol.toLocaleString('es-ES')} kg</b><em>progreso</em></div><div class="stat"><small>kcal estimadas</small><b>${Math.round(mins*7.5)}</b><em>estimación</em></div></div><div class="chart"><b>Evolución de fuerza</b><svg viewBox="0 0 330 160"><path d="M15 135H315M15 100H315M15 65H315M15 30H315" stroke="#183747"/><polyline points="15,125 65,116 115,103 165,96 215,80 265,67 315,45" fill="none" stroke="#0aa4ff" stroke-width="4"/><g fill="#0aa4ff">${[[15,125],[65,116],[115,103],[165,96],[215,80],[265,67],[315,45]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}</g></svg></div><div class="moreCard"><div class="ico">${icon('chart')}</div><div><b>Logros</b><small>${Math.max(1,sessions)} objetivos completados</small></div><div class="arr">›</div></div></div>`,'progress')}
function more(){render(`${head('Más','TODO EN UN MISMO ESTILO','home()')}<div class="page">${moreCard('bolt','Calistenia','Programa y entrenamientos','calisthenics()')}${moreCard('heart','Cardio','Sesiones guiadas','cardio()')}${moreCard('calendar','Calendario','Planifica tu disciplina','calendarPage()')}${moreCard('user','Perfil','Tu actividad y datos','profile()')}${moreCard('gear','Ajustes','Ritmo y preferencias','settings()')}</div>`,'more')}
function moreCard(ic,t,s,fn){return `<div class="moreCard" onclick="${fn}"><div class="ico">${icon(ic)}</div><div><b>${t}</b><small>${s}</small></div><div class="arr">›</div></div>`}
function calendarPage(){const d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();render(`${head('Calendario','PLANIFICA TU DISCIPLINA','more()')}<div class="page"><div class="sectionTitle"><h1>${d.toLocaleDateString('es',{month:'long',year:'numeric'})}</h1></div><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div style="text-align:center;font-size:8px;color:#8fa8b6">${x}</div>`).join('')}${Array.from({length:days},(_,i)=>`<div class="day ${S.logs.some(x=>new Date(x.date).getDate()===i+1)?'done':''}">${i+1}</div>`).join('')}</div></div>`,'more')}
function profile(){render(`${head('Perfil','TU CUENTA','more()')}<div class="page" style="text-align:center"><div style="width:88px;height:88px;border-radius:50%;border:3px solid var(--blue);display:grid;place-items:center;margin:25px auto 10px;color:var(--blue)">${icon('user')}</div><h2>DM Fitness</h2><p style="color:#9eb4c0;font-size:10px">Disciplina hoy, resultados mañana.</p>${moreCard('chart','Mis estadísticas','Consulta tu evolución','progress()')}${moreCard('gear','Ajustes','Personaliza la experiencia','settings()')}</div>`,'more')}
function settings(){render(`${head('Ajustes','PERSONALIZA TU EXPERIENCIA','more()')}<div class="page"><div class="setting"><div><b>Cadencia de repetición</b><small>Conteo automático de ejercicios.</small></div><div class="stepper"><button onclick="cad(-.5)">−</button><b>${S.cadence}s</b><button onclick="cad(.5)">+</button></div></div><div class="setting"><div><b>Datos guardados</b><small>Pesos, entrenamientos y progreso.</small></div><button onclick="exportData()" style="border:1px solid #31566b;background:#0d2634;color:#fff;border-radius:9px;padding:8px">Exportar</button></div></div>`,'more')}
function cad(d){S.cadence=Math.max(1.5,Math.min(6,Math.round((S.cadence+d)*2)/2));save();settings()}function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dm-fitness-datos.json';a.click()}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function motionArrow(){return `<svg viewBox="0 0 40 70"><path d="M20 62V13" stroke="#0aa4ff" stroke-width="6" stroke-linecap="round"/><path d="M9 24L20 12l11 12" fill="none" stroke="#0aa4ff" stroke-width="6" stroke-linecap="round"/></svg>`}
function poseSVG(kind='press',phase=0){

const defs=`<defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c5a3"/><stop offset=".45" stop-color="#c5815c"/><stop offset="1" stop-color="#704432"/></linearGradient><linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24343f"/><stop offset=".55" stop-color="#111c23"/><stop offset="1" stop-color="#060d12"/></linearGradient><linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d2d36"/><stop offset="1" stop-color="#081116"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3d4c55"/><stop offset=".5" stop-color="#aebbc2"/><stop offset="1" stop-color="#303c43"/></linearGradient><radialGradient id="muscle"><stop offset="0" stop-color="#ff9b83"/><stop offset=".55" stop-color="#df6e50"/><stop offset="1" stop-color="#8b3f31"/></radialGradient><filter id="ds"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity=".28"/></filter></defs>`;

/* ===== DM FITNESS · PREMIUM GLASS 2026 ===== */
:root{
  --bg:#030a10;--bg2:#07131b;--card:#0a1821;--card2:#0d202b;--line:#173646;
  --blue:#17a9ff;--blue2:#68d4ff;--text:#f7fbff;--muted:#8ea6b4;
  --green:#37df8c;--red:#ff5e68;--yellow:#ffc857;--r:22px;
}
html,body{background:#02070b;color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Arial,sans-serif}
.app{
  max-width:430px;background:
    radial-gradient(circle at 85% -5%,rgba(23,169,255,.16),transparent 28%),
    radial-gradient(circle at 0% 20%,rgba(42,104,140,.13),transparent 28%),
    linear-gradient(180deg,#06131b 0%,#030a10 64%,#02070b 100%);
  box-shadow:0 0 80px rgba(0,0,0,.8)
}
.status{height:34px;color:#d9e8f0;font-size:11px;letter-spacing:.2px}
.top{
  min-height:58px;background:rgba(3,10,16,.82);border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)
}
.top h1{font-size:17px;letter-spacing:.1px}.back{color:var(--blue2)}
.brand{padding:16px 0 14px}.brand .dm{font-size:43px;letter-spacing:-4px}.brand .fit{font-size:27px;color:#fff;margin-left:7px}
.brand small{color:var(--blue2);font-weight:800;letter-spacing:2px}
.hero{height:390px;border-radius:28px;border:1px solid rgba(104,212,255,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 24px 60px rgba(0,0,0,.35)}
.hero:after{background:linear-gradient(180deg,rgba(0,0,0,.02) 25%,rgba(3,10,16,.08) 50%,rgba(3,10,16,.96) 100%)}
.heroCopy{bottom:20px}.heroCopy h2{font-size:29px;letter-spacing:-.6px;font-style:normal;font-weight:950}
.primary{border-radius:15px;background:linear-gradient(135deg,#0d8ff3 0%,#19b9ff 100%);padding:15.5px;box-shadow:0 12px 28px rgba(23,169,255,.25);letter-spacing:.2px}
.quick{gap:11px}.quickCard,.plan,.groupRow,.info,.trainCard,.stat,.chart,.moreCard,.setting,.nextCard{
  background:linear-gradient(145deg,rgba(15,37,50,.93),rgba(6,19,28,.95));
  border:1px solid rgba(104,212,255,.17);box-shadow:inset 0 1px rgba(255,255,255,.02),0 10px 28px rgba(0,0,0,.16)
}
.quickCard{min-height:126px;border-radius:20px}.quickCard .ico{width:44px;height:44px}.quickCard b{font-size:14px;letter-spacing:.4px}.quickCard small{color:#91aab8}
.quote{color:#718995}
.sectionTitle h1{font-size:28px;letter-spacing:-.7px}.sectionTitle small{color:#7fa0b2}
.seg,.modes{background:rgba(255,255,255,.025);padding:4px;border-radius:14px;gap:4px}
.seg button,.chips button,.modes button,.tabs button{border-color:rgba(104,212,255,.16);background:rgba(13,32,43,.85);border-radius:11px}
.seg button.on,.chips button.on,.tabs button.on{background:linear-gradient(135deg,#0c8eef,#18b9ff);box-shadow:0 6px 16px rgba(23,169,255,.22)}
.modes button.on{background:#102d3c;color:#fff;box-shadow:inset 0 -2px var(--blue)}
.plan{border-radius:18px;min-height:94px}.planArt{height:94px;background:radial-gradient(circle at 50% 25%,#1a3949,#08151d 70%)}
.search{height:46px;border-radius:14px;background:rgba(8,24,34,.92);border-color:rgba(104,212,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.chips{padding:11px 0}.chips button{padding:9px 13px}
.groupRow{border-radius:17px;min-height:76px}.groupThumb{height:76px;background:linear-gradient(145deg,#edf4f6,#dbe7ec)}
.exerciseGrid{gap:11px}.exTile{border-radius:18px;border:1px solid rgba(104,212,255,.18);background:#eef3f6;box-shadow:0 12px 26px rgba(0,0,0,.18)}
.exTile .art{height:134px;background:radial-gradient(circle at 50% 20%,#fff,#e8eef2 70%)}
.exTile b{font-size:11.5px}.detail h1{font-size:29px;letter-spacing:-.7px}.musLine{color:#86a6b7}
.motionCard{height:310px;border-radius:22px;border:1px solid rgba(104,212,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.22);background:radial-gradient(circle at 50% 20%,#fff,#e7eef2 72%)}
.motionLabel{left:14px;bottom:12px;background:rgba(3,10,16,.84);backdrop-filter:blur(8px);padding:7px 11px}
.poseCard{border-radius:16px;border-color:#d2dfe5}.poseCard b{padding:8px}
.tabs{padding:4px;background:rgba(255,255,255,.025);border-radius:14px}.muscles{border-radius:18px;border-color:rgba(104,212,255,.16);background:linear-gradient(145deg,#0d222e,#081821)}
.info{border-radius:18px;padding:14px}.info h3{color:var(--blue2);font-size:13px}.step{font-size:10px;line-height:1.5}.step i{background:linear-gradient(135deg,#0c8eef,#18b9ff)}
.trainProgress{height:7px;background:#0d2937}.trainProgress i{background:linear-gradient(90deg,#0c8eef,#38c9ff)}
.trainCard{border-radius:22px;padding:13px}.trainCard h2{font-size:22px}.trainMotion{height:260px;border-radius:17px;background:radial-gradient(circle at 50% 20%,#fff,#e7eef2 72%)}
.ring{width:126px;height:126px;background:conic-gradient(var(--blue) var(--pct),#123445 0);box-shadow:0 0 30px rgba(23,169,255,.14)}
.ring:before{width:102px;height:102px;background:#06141c}.ringInner b{font-size:40px}.countBtns button{border-color:rgba(104,212,255,.22);background:#0b202b}.countBtns .pause{background:linear-gradient(135deg,#0c8eef,#18b9ff);box-shadow:0 8px 20px rgba(23,169,255,.22)}
.metric{border-radius:14px;background:#091b25;border-color:rgba(104,212,255,.15)}
.nextCard{border-radius:16px}.restOverlay{background:rgba(1,6,10,.96);backdrop-filter:blur(8px)}.restRing{border-color:#123747;border-top-color:#22b9ff;box-shadow:0 0 40px rgba(23,169,255,.14)}
.stat{border-radius:18px}.stat b{font-size:24px}.chart{border-radius:20px;padding:14px}
.moreCard,.setting{border-radius:17px}.calendar{gap:6px}.day{border-radius:11px;background:#081a24;border-color:rgba(104,212,255,.13)}.day.done{background:linear-gradient(145deg,#0b4767,#0d5b80);box-shadow:0 0 0 1px rgba(23,169,255,.15)}
.nav{height:80px;background:rgba(2,8,12,.92);border-top:1px solid rgba(104,212,255,.12);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)}
.nav button{font-size:8px;color:#708994;transition:.2s}.nav button.on{color:#36c4ff}.nav button.on svg{filter:drop-shadow(0 0 6px rgba(23,169,255,.45))}
.toast{background:#0d2632;border-color:rgba(104,212,255,.22);box-shadow:0 10px 25px rgba(0,0,0,.3)}
@media(max-width:370px){.hero{height:345px}.trainMotion{height:225px}}

function anatomyProfile(e){
 const g=(e.group||'').toLowerCase(), n=(e.name||'').toLowerCase();
 if(g.includes('pecho'))return {key:'chest',main:e.mus[0]||'Pectoral mayor',sec:e.mus[1]||'Tríceps',stab:e.mus[2]||'Deltoides anterior',joints:['Hombro','Codo','Escápula'],action:'Aducción y flexión horizontal del hombro',range:'Escápulas estables; baja hasta un rango cómodo sin perder el control del hombro.'};
 if(g.includes('espalda'))return {key:'back',main:e.mus[0]||'Dorsal ancho',sec:e.mus[1]||'Romboides',stab:e.mus[2]||'Bíceps',joints:['Hombro','Codo','Escápula'],action:'Extensión/aducción del hombro y retracción escapular',range:'Inicia con control escapular y evita compensar arqueando la zona lumbar.'};
 if(g.includes('hombro'))return {key:'shoulder',main:e.mus[0]||'Deltoides',sec:e.mus[1]||'Trapecio',stab:e.mus[2]||'Manguito rotador',joints:['Hombro','Escápula','Codo'],action:'Elevación o abducción del brazo',range:'Mantén hombro centrado y costillas controladas durante todo el recorrido.'};
 if(g.includes('brazo'))return {key:n.includes('tríceps')?'triceps':'arms',main:e.mus[0]||'Bíceps braquial',sec:e.mus[1]||'Braquial',stab:e.mus[2]||'Antebrazo',joints:['Codo','Muñeca','Hombro'],action:n.includes('tríceps')?'Extensión del codo':'Flexión del codo',range:'Evita desplazar el hombro para que el trabajo permanezca en el brazo.'};
 if(g.includes('core'))return {key:'core',main:e.mus[0]||'Recto abdominal',sec:e.mus[1]||'Oblicuos',stab:e.mus[2]||'Transverso',joints:['Columna','Pelvis','Cadera'],action:'Estabilización lumbopélvica y control anti-extensión',range:'Mantén pelvis y caja torácica alineadas; evita hundir la zona lumbar.'};
 if(g.includes('full'))return {key:'full',main:e.mus[0]||'Cadena global',sec:e.mus[1]||'Core',stab:e.mus[2]||'Cintura escapular',joints:['Cadera','Rodilla','Hombro','Columna'],action:'Coordinación global de tren superior e inferior',range:'Prioriza alineación y control antes que velocidad.'};

}

function anatomyView(id,view='front'){
